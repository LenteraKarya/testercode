<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - APLIKASI BARJAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0d47a1, #082e5c);
            --success-gradient: linear-gradient(135deg, #00695c, #004d40);
            --warning-gradient: linear-gradient(135deg, #ff8f00, #e65100);
            --login-gradient: linear-gradient(135deg, #0d47a1 0%, #00695c 50%, #ff8f00 100%);
            --login-bg-gradient: linear-gradient(135deg, #f5f9ff 0%, #e8f5e9 100%);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 28px rgba(0,0,0,0.15);
        }
        
        body {
            background: var(--login-bg-gradient);
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* Container untuk particles.js */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        .login-container {
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transform: translateY(0);
            transition: all 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        .login-header {
            background: var(--login-gradient);
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .login-logo {
            font-size: 2.8rem;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }
        
        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            position: relative;
            z-index: 1;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }
        
        .login-subtitle {
            font-size: 0.95rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .login-body {
            padding: 25px;
        }
        
        .form-label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        
        .form-label i {
            margin-right: 6px;
            color: #0d47a1;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: all 0.3s;
            box-shadow: var(--shadow-sm);
            font-size: 0.9rem;
        }
        
        .form-control:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.2);
        }
        
        .input-group-text {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .btn-login {
            background: var(--login-gradient);
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 1rem;
            color: white;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .btn-login::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }
        
        .btn-login:hover::before {
            left: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .security-shield {
            font-size: 3rem;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .copyright {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.85rem;
        }
        
        .attempts-warning {
            font-size: 0.85rem;
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        .countdown-timer {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        .input-error {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }
        
        .error-message {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }
        
        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.5s;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0d47a1;
            border-radius: 8px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #082e5c;
        }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div id="particles-js"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="security-shield">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1 class="login-title">APLIKASI BARJAS</h1>
                <p class="login-subtitle">Dinas Peternakan dan Perikanan Situbondo</p>
            </div>
            
            <div class="login-body">
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="form-label"><i class="fas fa-user"></i>Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-building"></i></span>
                            <input type="text" class="form-control" id="username" value="Lentera Karya Situbondo" readonly>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label"><i class="fas fa-lock"></i>Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Masukkan password sistem" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="password-error">Password salah. Silakan coba lagi.</div>
                    </div>
                    
                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Aplikasi
                    </button>
                    
                    <div class="attempts-warning" id="attemptsWarning">
                        <i class="fas fa-exclamation-triangle me-1"></i>
                        <span id="attemptsCount">2</span> percobaan tersisa sebelum sistem terkunci.
                    </div>
                    
                    <div class="countdown-timer" id="countdownTimer">
                        <i class="fas fa-clock me-1"></i>
                        Sistem terkunci. Coba lagi dalam <span id="countdown">05:00</span>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="copyright">
            &copy; 2025 Lentera Karya Situbondo. Hak Cipta Dilindungi.
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <script>
        // Daftar password yang valid (huruf kapital A-Z diikuti 8 digit angka)
        const validPasswords = [
            "S01634851", "V02468642", "X03579753", "I04445555", 
            "Z05252525", "L06644228", "E07722277", "H08877665", 
            "J09753123", "A01234567", "B02345678", "C03456789",
            "D04567890", "F05678901", "G06789012", "K07890123",
            "M08901234", "N09012345", "O00123456", "P01234567",
            "Q02345678", "R03456789", "T04567890", "U05678901",
            "W06789012", "Y07890123"
        ];
        
        // Inisialisasi variabel
        let loginAttempts = 0;
        const maxAttempts = 5;
        let isLocked = false;
        let lockUntil = 0;
        
        // Fungsi untuk inisialisasi aplikasi login
        function initLogin() {
            // Cek status kunci
            checkLockStatus();
            
            // Setup event listeners
            setupLoginEvents();
            
            // Inisialisasi particles.js
            initParticles();
        }
        
        // Fungsi untuk memeriksa status kunci
        function checkLockStatus() {
            const savedLock = localStorage.getItem('barjas_login_lock');
            const savedAttempts = localStorage.getItem('barjas_login_attempts');
            
            if (savedLock) {
                lockUntil = parseInt(savedLock);
                const currentTime = Date.now();
                
                if (currentTime < lockUntil) {
                    // Masih dalam masa terkunci
                    isLocked = true;
                    startCountdown(lockUntil - currentTime);
                } else {
                    // Masa terkunci sudah selesai
                    isLocked = false;
                    localStorage.removeItem('barjas_login_lock');
                }
            }
            
            if (savedAttempts) {
                loginAttempts = parseInt(savedAttempts);
                updateAttemptsWarning();
            }
        }
        
        // Fungsi untuk mengatur event listeners
        function setupLoginEvents() {
            // Form submission
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                attemptLogin();
            });
            
            // Toggle password visibility
            document.getElementById('togglePassword').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Ganti icon
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
        }
        
        // Fungsi untuk mencoba login
        function attemptLogin() {
            if (isLocked) {
                showError('Sistem terkunci. Silakan coba lagi setelah waktu yang ditentukan.');
                return;
            }
            
            const password = document.getElementById('password').value.trim();
            
            // Validasi password
            if (validPasswords.includes(password)) {
                // Login berhasil
                loginSuccess();
            } else {
                // Login gagal
                loginFailed();
            }
        }
        
        // Fungsi ketika login berhasil
        function loginSuccess() {
            // Reset attempts
            loginAttempts = 0;
            localStorage.removeItem('barjas_login_attempts');
            
            // Simpan status login
            localStorage.setItem('barjas_logged_in', 'true');
            localStorage.setItem('barjas_login_time', Date.now().toString());
            
            // Redirect ke aplikasi utama
            window.location.href = 'index.html';
        }
        
        // Fungsi ketika login gagal
        function loginFailed() {
            // Tambah attempt
            loginAttempts++;
            localStorage.setItem('barjas_login_attempts', loginAttempts.toString());
            
            // Update warning
            updateAttemptsWarning();
            
            // Animasi shake
            document.getElementById('loginForm').classList.add('shake');
            setTimeout(() => {
                document.getElementById('loginForm').classList.remove('shake');
            }, 500);
            
            // Tampilkan error
            showError('Password salah. Silakan coba lagi.');
            
            // Kosongkan password field
            document.getElementById('password').value = '';
            
            // Cek jika sudah mencapai batas maksimal
            if (loginAttempts >= maxAttempts) {
                lockSystem();
            }
        }
        
        // Fungsi untuk mengunci sistem
        function lockSystem() {
            isLocked = true;
            const lockTime = 5 * 60 * 1000; // 5 menit dalam milidetik
            lockUntil = Date.now() + lockTime;
            
            // Simpan ke localStorage
            localStorage.setItem('barjas_login_lock', lockUntil.toString());
            
            // Tampilkan countdown
            startCountdown(lockTime);
            
            // Sembunyikan form
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('attemptsWarning').style.display = 'none';
            document.getElementById('countdownTimer').style.display = 'block';
        }
        
        // Fungsi untuk memulai countdown
        function startCountdown(duration) {
            const countdownElement = document.getElementById('countdown');
            const timerDisplay = document.getElementById('countdownTimer');
            const loginBtn = document.getElementById('loginBtn');
            
            timerDisplay.style.display = 'block';
            loginBtn.disabled = true;
            
            const timer = setInterval(function() {
                duration -= 1000;
                
                if (duration <= 0) {
                    clearInterval(timer);
                    isLocked = false;
                    localStorage.removeItem('barjas_login_lock');
                    timerDisplay.style.display = 'none';
                    loginBtn.disabled = false;
                    return;
                }
                
                const minutes = Math.floor(duration / 60000);
                const seconds = Math.floor((duration % 60000) / 1000);
                
                countdownElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        // Fungsi untuk memperbarui peringatan percobaan
        function updateAttemptsWarning() {
            const attemptsLeft = maxAttempts - loginAttempts;
            const warningElement = document.getElementById('attemptsWarning');
            const countElement = document.getElementById('attemptsCount');
            
            if (attemptsLeft > 0 && attemptsLeft < 3) {
                countElement.textContent = attemptsLeft;
                warningElement.style.display = 'block';
            } else {
                warningElement.style.display = 'none';
            }
        }
        
        // Fungsi untuk menampilkan error
        function showError(message) {
            const errorElement = document.getElementById('password-error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            
            // Highlight input
            document.getElementById('password').classList.add('input-error');
            
            // Sembunyikan error setelah 3 detik
            setTimeout(() => {
                errorElement.style.display = 'none';
                document.getElementById('password').classList.remove('input-error');
            }, 3000);
        }
        
        // Fungsi untuk inisialisasi particles.js
        function initParticles() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 30, density: { enable: true, value_area: 800 } },
                    color: { value: "#0d47a1" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#0d47a1",
                        opacity: 0.4,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "grab" },
                        onclick: { enable: true, mode: "push" },
                        resize: true
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 1 } },
                        push: { particles_nb: 4 }
                    }
                },
                retina_detect: true
            });
        }
        
        // Inisialisasi aplikasi saat dokumen siap
        document.addEventListener('DOMContentLoaded', initLogin);
    </script>
</body>
</html>
