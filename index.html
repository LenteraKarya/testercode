<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS – Nompak Ojek Situbondo (Ultra-Premium)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --primary:#111827;
      --accent:#00f5ff;
      --danger:#ff0055;
      --glass:rgba(255,255,255,.15);
      --text:#ffffff;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
    html,body{height:100%}
    body{
      background:linear-gradient(-45deg,#0f172a,#1e293b,#334155,#475569);
      background-size:400% 400%;
      animation:gradientBG 12s ease infinite;
      color:var(--text);
    }
    @keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .container{max-width:1000px;margin:0 auto;padding:1rem}
    header{text-align:center;padding:2.5rem 1rem}
    header h1{font-size:2.6rem;font-weight:800;background:linear-gradient(90deg,var(--accent),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    header p{opacity:.9;font-size:1.1rem;margin-top:.25rem}

    .progress{display:flex;justify-content:center;margin:1.5rem 0;gap:.8rem}
    .progress span{
      width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:var(--glass);color:var(--accent);font-weight:700;font-size:1.2rem;backdrop-filter:blur(8px);transition:.4s;
      border:1px solid rgba(255,255,255,.2);
    }
    .progress span.active{background:var(--accent);color:#0f172a;box-shadow:0 0 12px var(--accent)}

    .step{display:none;animation:fadeIn .6s}
    .step.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}

    .card{
      background:var(--glass);border:1px solid rgba(255,255,255,.2);
      border-radius:24px;backdrop-filter:blur(12px);padding:2rem;
      box-shadow:0 8px 32px rgba(0,0,0,.35);margin-bottom:2rem
    }
    label{display:block;margin:.75rem 0 .3rem;font-weight:600;font-size:.95rem}
    input,textarea{
      width:100%;padding:.9rem 1rem;background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:1rem;
    }
    input[readonly]{background:rgba(255,255,255,.05)}
    .btn-group{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.5rem}
    .btn{
      flex:1;min-width:160px;display:flex;align-items:center;justify-content:center;gap:.5rem;
      padding:1rem 1.8rem;font-size:1rem;font-weight:700;border:none;border-radius:50px;
      transition:.3s;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.25)
    }
    .btn-primary{background:linear-gradient(135deg,var(--accent),#00d1ff);color:#0f172a}
    .btn-primary:hover{box-shadow:0 0 20px var(--accent)}
    .btn-danger{background:linear-gradient(135deg,var(--danger),#ff3377);color:#fff}
    .btn-danger:hover{box-shadow:0 0 20px var(--danger)}

    #map{height:70vh;border-radius:24px;border:1px solid rgba(255,255,255,.2)}
    .drivers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem}
    .driver{
      background:var(--glass);border:1px solid rgba(255,255,255,.2);border-radius:20px;
      overflow:hidden;backdrop-filter:blur(8px);transition:.4s
    }
    .driver:hover{transform:translateY(-6px)}
    .driver img{width:100%;height:150px;object-fit:cover}
    .driver .name{font-weight:700;padding:1rem;font-size:1.1rem}
    .driver .btn{margin:0 1rem 1rem}

    .loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:.5rem}
    .loader .spinner{width:60px;height:60px;border:6px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p style="color:var(--accent)">Memuat peta...</p>
</div>

<header>
  <h1>NOS – Nompak Ojek Situbondo</h1>
  <p>Klik dua titik di peta → otomatis hitung rute via jalan raya</p>
</header>

<div class="container">
  <div class="progress">
    <span class="active" id="p1">1</span>
    <span id="p2">2</span>
    <span id="p3">3</span>
    <span id="p4">4</span>
  </div>

  <!-- Step 1 -->
  <div class="step active" id="step1">
    <div class="card">
      <h2><i class="fa-solid fa-location-dot"></i> 1. Pilih Lokasi</h2>
      <div id="map"></div>
      <label>Penjemputan</label>
      <input id="pickup" readonly/>
      <label>Tujuan</label>
      <input id="destination" readonly/>
      <label>Jarak via jalan raya</label>
      <input id="distance" readonly/>
      <label>Perkiraan tarif</label>
      <input id="fare" readonly/>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="next(2)"><i class="fa-solid fa-arrow-right"></i> Lanjut</button>
        <button class="btn btn-danger" onclick="resetAll()"><i class="fa-solid fa-rotate-left"></i> Reset Lokasi</button>
      </div>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="step" id="step2">
    <div class="card">
      <h2><i class="fa-solid fa-motorcycle"></i> 2. Pilih Kendaraan</h2>
      <label><input type="radio" name="vehicle" value="motor" checked/> Motor – Rp 1.200/km</label>
      <label><input type="radio" name="vehicle" value="mobil"/> Mobil – Rp 3.000/km</label>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="next(3)"><i class="fa-solid fa-arrow-right"></i> Lanjut</button>
        <button class="btn btn-danger" onclick="next(1)"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
      </div>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="step" id="step3">
    <div class="card">
      <h2><i class="fa-solid fa-user"></i> 3. Data Penumpang</h2>
      <label>Nama Lengkap</label>
      <input id="nama" placeholder="Contoh: Siti Nurhaliza"/>
      <label>Nomor WhatsApp</label>
      <input id="wa" placeholder="0812xxxx" type="tel"/>
      <label>Catatan (opsional)</label>
      <textarea id="catatan" rows="2" placeholder="Contoh: pakai helm double"></textarea>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="next(4)"><i class="fa-solid fa-arrow-right"></i> Lihat Driver</button>
        <button class="btn btn-danger" onclick="next(2)"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
      </div>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="step" id="step4">
    <div class="card">
      <h2><i class="fa-solid fa-id-card"></i> 4. Pilih Driver</h2>
      <div class="drivers" id="drivers"></div>
      <button class="btn btn-danger" onclick="next(3)"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1200;
  const TARIF_MOBIL = 3000;
  // Wilayah Situbondo diperluas ±30 km dari pusat kota
  const bounds = [[-7.95,113.7],[-7.45,114.3]];
  const drivers = [
    {name:'Budi Santoso',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver1.jpeg?raw=true'},
    {name:'Ani Wijaya',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver2.jpeg?raw=true'},
    {name:'Ahmad Firdaus',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver4.jpeg?raw=true'},
    {name:'Darmawan Setiawan',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver5.jpeg?raw=true'},
    {name:'Siti Rahmawati',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver6.jpeg?raw=true'}
  ];

  /* === MAP === */
  const map = L.map('map',{center:[-7.7058,114.0094],zoom:12,minZoom:11,maxZoom:18,maxBounds:bounds});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);

  let A,B,routeLine,distanceKm=0;

  /* Click Penjemputan & Tujuan */
  map.on('click',async e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Penjemputan').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Tujuan').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      await hitungRute();
    }
  });

  /* === Hitung rute via jalan raya (OSRM) === */
  async function hitungRute(){
    if(!A || !B) return;
    const [lat1,lng1]=[A.getLatLng().lat,A.getLatLng().lng];
    const [lat2,lng2]=[B.getLatLng().lat,B.getLatLng().lng];
    const url=`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;

    try{
      const res=await fetch(url);
      const data=await res.json();
      if(data.routes && data.routes[0]){
        const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distanceKm=(data.routes[0].distance/1000).toFixed(2);
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline(coords,{color:'#00f5ff',weight:6}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        updateFare();
      }
    }catch(err){
      alert('Gagal menghitung rute. Coba lagi.');
    }
  }

  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const tarifPerKm=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarifPerKm);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  function resetAll(){
    [A,B,routeLine].forEach(l=>l&&map.removeLayer(l));
    A=B=routeLine=null;
    ['pickup','destination','distance','fare'].forEach(id=>document.getElementById(id).value='');
  }

  /* === NAVIGASI STEP === */
  function next(n){
    if(n===2 && (!A || !B)){alert('Pilih Penjemputan & Tujuan terlebih dahulu');return;}
    if(n===4 && !document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    if(n===4 && !document.getElementById('wa').value.trim()){alert('Isi nomor WhatsApp');return;}

    document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.progress span').forEach((el,i)=>el.classList.toggle('active',i<n));
    document.getElementById('step'+n).classList.add('active');

    if(n===4) renderDrivers();
  }

  /* === RENDER DRIVER === */
  function renderDrivers(){
    const nama=document.getElementById('nama').value;
    const wa=document.getElementById('wa').value;
    const catatan=document.getElementById('catatan').value;
    const total=document.getElementById('fare').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const txt=`Halo, saya ${nama} (${wa})\n\nIngin pesan ojek NOS\nKendaraan: ${vehicle}\nJarak: ${distanceKm} km\nTotal: ${total}\nCatatan: ${catatan}`;

    const box=document.getElementById('drivers');
    box.innerHTML='';
    drivers.forEach(d=>{
      const div=document.createElement('div');
      div.className='driver';
      div.innerHTML=`
        <img src="${d.img}" alt="${d.name}">
        <div class="name">${d.name}</div>
        <button class="btn btn-primary" onclick="window.open('https://wa.me/${d.phone}?text=${encodeURIComponent(txt)}')">
          <i class="fa-brands fa-whatsapp"></i> Pilih Driver
        </button>
      `;
      box.appendChild(div);
    });
  }

  window.onload=()=>document.getElementById('loader').style.display='none';
</script>
</body>
</html>
