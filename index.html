<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS – Ojek Online Jawa Timur (Cari Jalan & Tempat + Label Lengkap)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{--sea:#0099cc;--sand:#fef7e6;--coral:#ff6b35;--dark:#121212;--darkCard:#1e1e1e;}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:var(--sand);color:#222;transition:background .3s}
    body.dark{background:var(--dark);color:#eee}
    header{background:var(--sea);color:#fff;padding:1rem;text-align:center}
    header h1{font-size:1.8rem}
    .container{max-width:1100px;margin:0 auto;padding:.5rem}
    .card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    body.dark .card{background:var(--darkCard)}
    label{display:block;margin:.3rem 0 .1rem;font-weight:600;font-size:.9rem}
    input,textarea{width:100%;padding:.5rem;border:1px solid #ddd;border-radius:8px;font-size:.9rem;resize:none}
    body.dark input,body.dark textarea{border-color:#555;color:#eee}
    .btn-group{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
    .btn{flex:1 1 150px;padding:.7rem;border:none;border-radius:25px;font-weight:700;cursor:pointer;font-size:.85rem}
    .btn-primary{background:var(--sea);color:#fff}
    .btn-danger{background:var(--coral);color:#fff}
    #map{height:65vh;border-radius:12px}
    #charCount{font-size:.7rem;color:#666;text-align:right}
    body.dark #charCount{color:#aaa}

    /* Pencarian */
    .leaflet-control-geocoder-form input{font-size:.85rem;border-radius:4px;border:1px solid #ccc;padding:2px 4px}
    .leaflet-control-locate a{color:var(--sea)}

    .vehicle-options{display:flex;gap:.5rem}
    .vehicle-card{flex:1 1 100px;border:2px solid #ddd;border-radius:10px;padding:.5rem;text-align:center;cursor:pointer;font-size:.8rem}
    .vehicle-card.selected{border-color:var(--sea);background:#e6f7ff}
    body.dark .vehicle-card.selected{background:#0c2e42}
    .vehicle-card i{font-size:1.5rem;margin-bottom:.2rem;color:var(--sea)}
    .vehicle-card input{display:none}

    .driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
    .driver-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
    body.dark .driver-card{background:var(--darkCard)}
    .driver-card img{width:100%;height:100px;object-fit:cover}
    .driver-info{padding:.5rem;font-size:.8rem}
    .driver-info .name{font-weight:700}
    .driver-info .rating{color:var(--coral)}
    .driver-info .plate{background:#eee;border-radius:6px;padding:.2rem .4rem;font-size:.7rem;color:#333;margin:.2rem 0}
    body.dark .driver-info .plate{background:#333;color:#eee}
  </style>
</head>
<body>
<header>
  <h1>NOS – Ojek Online Jawa Timur (Cari Jalan & Tempat)</h1>
  <p>Klik dua titik di peta atau cari nama jalan/tempat → pilih driver → order via WhatsApp</p>
</header>

<div class="container">
  <div class="card">
    <h2><i class="fa-solid fa-map-pin"></i> Pilih Lokasi / Cari Tempat</h2>
    <div id="map"></div>

    <label>Penjemputan</label>
    <input id="pickup" readonly/>
    <label>Tujuan</label>
    <input id="destination" readonly/>
    <label>Jarak via jalan</label>
    <input id="distance" readonly/>
    <label>Perkiraan tarif</label>
    <input id="fare" readonly/>

    <h3><i class="fa-solid fa-motorcycle"></i> Kendaraan</h3>
    <div class="vehicle-options">
      <label class="vehicle-card">
        <input type="radio" name="vehicle" value="motor" checked onchange="updateFare()"/>
        <i class="fa-solid fa-motorcycle"></i><br>Motor
      </label>
      <label class="vehicle-card">
        <input type="radio" name="vehicle" value="mobil" onchange="updateFare()"/>
        <i class="fa-solid fa-car-side"></i><br>Mobil
      </label>
    </div>

    <h3><i class="fa-solid fa-user"></i> Data Penumpang</h3>
    <input id="nama" placeholder="Nama lengkap"/>
    <input id="wa" placeholder="08 / 62" type="tel" maxlength="13" pattern="\d*"/>
    <textarea id="catatan" rows="2" placeholder="Catatan (maks 300)" maxlength="300"></textarea>
    <div id="charCount">0 / 300</div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="getCurrentLocation()">
        <i class="fa-solid fa-location-crosshairs"></i> Lokasi Saya
      </button>
      <button class="btn btn-primary" onclick="nextStep()">
        <i class="fa-brands fa-whatsapp"></i> Pilih Driver & Order
      </button>
      <button class="btn btn-danger" onclick="resetMap()">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <div id="driversCard" class="card" style="display:none">
    <h3><i class="fa-solid fa-id-card"></i> Pilih Driver</h3>
    <div id="drivers" class="driver-grid"></div>
  </div>

  <div id="summaryCard" class="card" style="display:none">
    <h3><i class="fa-solid fa-clipboard-check"></i> Ringkasan Pesanan</h3>
    <p><strong>Nama:</strong> <span id="sumNama"></span></p>
    <p><strong>Kendaraan:</strong> <span id="sumVehicle"></span></p>
    <p><strong>Jarak:</strong> <span id="sumDistance"></span></p>
    <p><strong>Estimasi Tarif:</strong> <span id="sumFare"></span></p>
    <p><strong>Catatan:</strong> <span id="sumCatatan"></span></p>
    <button class="btn btn-primary" id="btnChat"><i class="fa-brands fa-whatsapp"></i> Kirim ke WhatsApp</button>
  </div>
</div>

<!-- Leaflet + Plugins -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1200;
  const TARIF_MOBIL = 3000;
  const bounds = [[-8.8,111.8],[-6.8,115.8]];
  const map = L.map('map',{center:[-7.5,113],zoom:11,minZoom:9,maxZoom:19,maxBounds:bounds});
  /* Tile OSM Carto HD – label jalan & POI sangat lengkap, anti-blank zoom */
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap contributors',
    maxNativeZoom:19,
    maxZoom:19
  }).addTo(map);

  /* Geocoder (search box) */
  const geocoder = L.Control.geocoder({
    defaultMarkGeocode: false,
    collapsed: false,
    placeholder: 'Cari jalan, gang, pasar, SPBU…',
    errorMessage: 'Tidak ditemukan'
  })
  .on('markgeocode', function(e) {
    const bbox = e.geocode.bbox;
    const poly = L.polygon([
      bbox.getSouthEast(),
      bbox.getNorthEast(),
      bbox.getNorthWest(),
      bbox.getSouthWest()
    ]).addTo(map);
    map.fitBounds(bbox);
    poly.remove();
    L.popup()
      .setLatLng(e.geocode.center)
      .setContent(e.geocode.name)
      .openOn(map);
  })
  .addTo(map);

  /* Locate control */
  L.control.locate({position:'topright', strings:{title:"Lokasi saya"}, locateOptions:{enableHighAccuracy:true}}).addTo(map);

  let A, B, routeLine, distanceKm = 0;
  const driverList = [
    {name:"Budi Santoso", wa:"6285647709114", img:"1", plat:"S 1234 JI", rating:4.9},
    {name:"Ani Wijaya", wa:"6285647709115", img:"2", plat:"N 5678 AT", rating:4.8},
    {name:"Rizky Pratama", wa:"6285647709116", img:"3", plat:"L 9012 TM", rating:4.7}
  ];

  document.getElementById('catatan').addEventListener('input',e=>{
    document.getElementById('charCount').textContent=e.target.value.length+' / 300';
  });

  /* Klik titik */
  map.on('click',async e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Penjemputan').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Tujuan').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      await hitungRute();
    }
  });

  async function hitungRute(){
    if(!A || !B) return;
    const [lat1,lng1]=[A.getLatLng().lat,A.getLatLng().lng];
    const [lat2,lng2]=[B.getLatLng().lat,B.getLatLng().lng];
    const url=`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
    try{
      const res=await fetch(url);
      const data=await res.json();
      if(data.routes && data.routes[0]){
        const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distanceKm=(data.routes[0].distance/1000).toFixed(2);
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline(coords,{color:'var(--sea)',weight:6}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        updateFare();
      }
    }catch{alert('Gagal menghitung rute. Coba lagi.');}
  }

  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const tarifPerKm=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarifPerKm);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  function getCurrentLocation(){
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude,longitude}=pos.coords;
      map.setView([latitude,longitude],15);
      if(A){map.removeLayer(A);A=null;}
      A=L.marker([latitude,longitude]).addTo(map).bindPopup('Lokasi Saya').openPopup();
      document.getElementById('pickup').value=`${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    });
  }

  function resetMap(){
    [A,B,routeLine].forEach(l=>l&&map.removeLayer(l));
    A=B=routeLine=null;
    ['pickup','destination','distance','fare','nama','wa','catatan'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('driversCard').style.display='none';
    document.getElementById('summaryCard').style.display='none';
    document.getElementById('charCount').textContent='0 / 300';
  }

  function validateWA(num){
    return /^(08|62)\d{8,11}$/.test(num.trim());
  }

  function nextStep(){
    if(!A || !B){alert('Pilih Penjemputan & Tujuan');return;}
    if(!document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    const wa=document.getElementById('wa').value.trim();
    if(!validateWA(wa)){alert('Nomor WhatsApp harus 08/62 + 8-11 digit angka');return;}
    renderDrivers();
    document.getElementById('driversCard').style.display='block';
  }

  function renderDrivers(){
    const container=document.getElementById('drivers');
    container.innerHTML='';
    driverList.forEach(d=>{
      const div=document.createElement('div');
      div.className='driver-card';
      div.innerHTML=`
        <img src="https://i.pravatar.cc/150?img=${d.img}" alt="${d.name}">
        <div class="driver-info">
          <div class="name">${d.name}</div>
          <div class="rating"><i class="fa-solid fa-star"></i> ${d.rating}</div>
          <div class="plate">${d.plat}</div>
          <button class="btn btn-primary" onclick="selectDriver('${d.wa}','${d.name}')">Pilih Driver</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function selectDriver(no,nama){
    selectedDriver={no,nama};
    const namaPen=document.getElementById('nama').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const catatan=document.getElementById('catatan').value;
    const fare=document.getElementById('fare').value;

    document.getElementById('sumNama').textContent=namaPen;
    document.getElementById('sumVehicle').textContent=vehicle==='motor'?'Motor':'Mobil';
    document.getElementById('sumDistance').textContent=`${distanceKm} km`;
    document.getElementById('sumFare').textContent=fare;
    document.getElementById('sumCatatan').textContent=catatan || '-';

    document.getElementById('driversCard').style.display='none';
    document.getElementById('summaryCard').style.display='block';

    const text=`Halo ${nama}, saya ${namaPen}\nIngin pesan ojek NOS:\nKendaraan: ${vehicle}\nJarak: ${distanceKm} km\nEstimasi: ${fare}\nCatatan: ${catatan}`;
    document.getElementById('btnChat').onclick=()=>window.open(`https://wa.me/${no}?text=${encodeURIComponent(text)}`);
  }
</script>
</body>
</html>
