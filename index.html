<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS – Nompak Ojek Situbondo (Final)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <!-- Leaflet & FontAwesome CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --primary:#0f172a;
      --accent:#f97316;
      --success:#10b981;
      --danger:#ef4444;
      --light:#f8fafc;
      --gray:#64748b;
      --bg:#e2e8f0;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:var(--bg);color:var(--primary)}
    .container{max-width:900px;margin:0 auto;padding:1rem}
    .hide{display:none}
    /* Header */
    header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:2rem 1rem;text-align:center}
    header h1{font-size:2rem}
    header p{opacity:.8;margin-top:.25rem}
    /* Progress bar */
    .progress{display:flex;justify-content:center;margin:1rem 0;gap:.5rem}
    .progress span{
      width:40px;height:40px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:#cbd5e1;color:var(--primary);font-weight:600;transition:.3s
    }
    .progress span.active{background:var(--accent);color:#fff}
    /* Steps */
    .step{display:none}
    .step.active{display:block;animation:fadeIn .4s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    /* Card */
    .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:1rem;margin-bottom:1rem}
    label{display:block;margin:.5rem 0 .25rem;font-weight:600;font-size:.9rem}
    input,select,textarea{width:100%;padding:.6rem;border:1px solid #cbd5e1;border-radius:6px;font-size:1rem}
    input[readonly]{background:#f1f5f9}
    .btn{
      display:inline-block;padding:.75rem 1.5rem;
      background:var(--accent);color:#fff;border:none;border-radius:9999px;
      font-weight:600;cursor:pointer;transition:.3s;margin:.25rem
    }
    .btn:hover{transform:translateY(-2px)}
    .btn-success{background:var(--success)}
    .btn-danger{background:var(--danger)}
    /* Map */
    #map{height:60vh;border-radius:12px}
    /* Driver list */
    .drivers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
    .driver{
      background:#fff;border:1px solid #e2e8f0;border-radius:12px;
      overflow:hidden;text-align:center;transition:.3s;cursor:pointer
    }
    .driver:hover{transform:scale(1.02)}
    .driver img{width:100%;height:120px;object-fit:cover}
    .driver .name{font-weight:600;padding:.5rem}
    /* Loading */
    .loader{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;
      flex-direction:column;gap:.5rem
    }
    .loader .spinner{
      width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:var(--accent);
      border-radius:50%;animation:spin 1s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<!-- Loading -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p style="color:var(--accent)">Memuat peta...</p>
</div>

<!-- Header -->
<header>
  <h1>NOS – Nompak Ojek Situbondo</h1>
  <p>Pilih titik → pilih driver → langsung order!</p>
</header>

<div class="container">
  <!-- Progress -->
  <div class="progress">
    <span class="active" id="p1">1</span>
    <span id="p2">2</span>
    <span id="p3">3</span>
    <span id="p4">4</span>
  </div>

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <div class="card">
      <h2><i class="fa-solid fa-location-dot"></i> 1. Pilih Lokasi</h2>
      <div id="map"></div>
      <label>Pickup (Titik A)</label>
      <input id="pickup" readonly/>
      <label>Destination (Titik B)</label>
      <input id="destination" readonly/>
      <label>Jarak</label>
      <input id="distance" readonly/>
      <label>Tarif (Rp 1.200/km)</label>
      <input id="fare" readonly/>
      <br>
      <button class="btn" onclick="next(2)">Lanjut <i class="fa-solid fa-arrow-right"></i></button>
      <button class="btn-danger" onclick="resetMap()">Reset Titik</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="card">
      <h2><i class="fa-solid fa-motorcycle"></i> 2. Pilih Kendaraan</h2>
      <label><input type="radio" name="vehicle" value="motor" checked/> Motor (Rp 1.200/km)</label>
      <label><input type="radio" name="vehicle" value="mobil"/> Mobil (Rp 2.000/km)</label>
      <br>
      <button class="btn" onclick="next(3)">Lanjut</button>
      <button class="btn-danger" onclick="next(1)">Kembali</button>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="card">
      <h2><i class="fa-solid fa-user"></i> 3. Data Penumpang</h2>
      <label>Nama Lengkap</label>
      <input id="nama" placeholder="Contoh: Siti Nurhaliza"/>
      <label>Nomor WhatsApp</label>
      <input id="wa" placeholder="0812xxxx" type="tel"/>
      <label>Catatan (opsional)</label>
      <textarea id="catatan" rows="2" placeholder="Contoh: pakai helm double"></textarea>
      <br>
      <button class="btn" onclick="next(4)">Lanjut</button>
      <button class="btn-danger" onclick="next(2)">Kembali</button>
    </div>
  </div>

  <!-- STEP 4 -->
  <div class="step" id="step4">
    <div class="card">
      <h2><i class="fa-solid fa-id-card"></i> 4. Pilih Driver</h2>
      <div class="drivers" id="drivers"></div>
      <button class="btn-danger" onclick="next(3)">Kembali</button>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1200; // per km
  const TARIF_MOBIL = 2000; // per km
  const bounds = [[-7.74, 113.98],[-7.68, 114.04]]; // Situbondo
  const drivers = [
    {name:'Budi Santoso',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver1.jpeg?raw=true'},
    {name:'Ani Wijaya',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver2.jpeg?raw=true'},
    {name:'Ahmad Firdaus',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver4.jpeg?raw=true'},
    {name:'Darmawan Setiawan',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver5.jpeg?raw=true'},
    {name:'Siti Rahmawati',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver6.jpeg?raw=true'}
  ];

  /* === MAP === */
  const map = L.map('map',{center:[-7.7058,114.0094],zoom:14,minZoom:13,maxZoom:18,maxBounds:bounds});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  let A,B,line,distanceKm=0;

  /* Click titik A & B */
  map.on('click',e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Pickup').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Destination').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      line=L.polyline([A.getLatLng(),B.getLatLng()],{color:'red'}).addTo(map);
      distanceKm=(map.distance(A.getLatLng(),B.getLatLng())/1000).toFixed(2);
      updateFare();
    }
  });

  /* === FUNGSI === */
  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const tarifPerKm=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarifPerKm);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  function resetMap(){
    [A,B,line].forEach(m=>m&&map.removeLayer(m));
    A=B=line=null;
    ['pickup','destination','distance','fare'].forEach(id=>document.getElementById(id).value='');
  }

  /* Navigasi step */
  function next(n){
    if(n===2 && (!A || !B)){alert('Silakan pilih pickup & destination terlebih dahulu');return;}
    if(n===4 && !document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    if(n===4 && !document.getElementById('wa').value.trim()){alert('Isi nomor WhatsApp');return;}

    document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.progress span').forEach((el,i)=>el.classList.toggle('active',i<n));
    document.getElementById('step'+n).classList.add('active');

    if(n===4) renderDrivers();
  }

  /* Render driver */
  function renderDrivers(){
    const nama=document.getElementById('nama').value;
    const wa=document.getElementById('wa').value;
    const catatan=document.getElementById('catatan').value;
    const total=document.getElementById('fare').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const txt=`Halo, saya ${nama} (${wa})\n\nIngin pesan ojek NOS\nKendaraan: ${vehicle}\nJarak: ${distanceKm} km\nTotal: ${total}\nCatatan: ${catatan}`;

    const box=document.getElementById('drivers');
    box.innerHTML='';
    drivers.forEach(d=>{
      const div=document.createElement('div');
      div.className='driver';
      div.innerHTML=`
        <img src="${d.img}" alt="${d.name}">
        <div class="name">${d.name}</div>
        <button class="btn" onclick="window.open('https://wa.me/${d.phone}?text=${encodeURIComponent(txt)}')">
          <i class="fa-brands fa-whatsapp"></i> Pilih
        </button>
      `;
      box.appendChild(div);
    });
  }

  /* On load */
  window.onload=()=>document.getElementById('loader').style.display='none';
</script>
</body>
</html>
