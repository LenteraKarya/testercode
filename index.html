<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS – Ojek Online Jatim</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <!-- CDN Leaflet & FontAwesome -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --sea:#0099cc;
      --sand:#fef7e6;
      --coral:#ff6b35;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:var(--sand);color:#222}
    header{background:var(--sea);color:#fff;padding:1.5rem;text-align:center}
    header h1{font-size:2.2rem}
    .container{max-width:1000px;margin:0 auto;padding:1rem}
    .card{background:#fff;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    label{display:block;margin:.5rem 0 .2rem;font-weight:600}
    input,textarea{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:10px;font-size:1rem}
    .btn-group{display:flex;gap:1rem;margin-top:1rem}
    .btn{flex:1;padding:.9rem;border:none;border-radius:50px;font-weight:700;cursor:pointer;transition:.3s}
    .btn-primary{background:var(--sea);color:#fff}
    .btn-danger{background:var(--coral);color:#fff}
    #map{height:70vh;border-radius:16px}
    .loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999}
    .loader .spinner{width:60px;height:60px;border:6px solid #eee;border-top-color:var(--sea);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div></div>

<header>
  <h1>NOS – Ojek Online Jawa Timur</h1>
  <p>Klik dua titik di peta → pilih driver → order via WhatsApp</p>
</header>

<div class="container">
  <div class="card">
    <h2><i class="fa-solid fa-map-pin"></i> 1. Pilih Lokasi</h2>
    <div id="map"></div>
    <label>Penjemputan</label>
    <input id="pickup" readonly/>
    <label>Tujuan</label>
    <input id="destination" readonly/>
    <label>Jarak via jalan</label>
    <input id="distance" readonly/>
    <label>Perkiraan tarif</label>
    <input id="fare" readonly/>

    <h3><i class="fa-solid fa-motorcycle"></i> Kendaraan</h3>
    <label><input type="radio" name="vehicle" value="motor" checked/> Motor – Rp 1.200/km</label>
    <label><input type="radio" name="vehicle" value="mobil"/> Mobil – Rp 3.000/km</label>

    <h3><i class="fa-solid fa-user"></i> Data Penumpang</h3>
    <input id="nama" placeholder="Nama lengkap"/>
    <input id="wa" placeholder="Nomor WhatsApp" type="tel"/>
    <textarea id="catatan" rows="2" placeholder="Catatan (opsional)"></textarea>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="nextStep()"><i class="fa-brands fa-whatsapp"></i> Pilih Driver & Order</button>
      <button class="btn btn-danger" onclick="resetMap()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>
  </div>

  <!-- Daftar driver (dummy) -->
  <div id="drivers" class="card" style="display:none">
    <h3>Pilih Driver</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem">
      <div class="card"><img src="https://i.pravatar.cc/150?img=1" style="width:100%;height:120px;object-fit:cover;border-radius:10px">
        <div style="padding:.5rem;font-weight:700">Budi Santoso</div>
        <button class="btn btn-primary" onclick="chat('6285647709114','Budi Santoso')">Chat WA</button>
      </div>
      <div class="card"><img src="https://i.pravatar.cc/150?img=2" style="width:100%;height:120px;object-fit:cover;border-radius:10px">
        <div style="padding:.5rem;font-weight:700">Ani Wijaya</div>
        <button class="btn btn-primary" onclick="chat('6285647709114','Ani Wijaya')">Chat WA</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1200;
  const TARIF_MOBIL = 3000;
  // Batas Provinsi Jawa Timur (kisaran ± 47.800 km²)
  const bounds = [[-8.8,111.8],[-6.8,115.8]];
  const map = L.map('map',{center:[-7.5,113],zoom:8,minZoom:7,maxZoom:18,maxBounds:bounds});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);

  let A,B,routeLine,distanceKm=0;

  /* Click titik */
  map.on('click',async e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Penjemputan').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Tujuan').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      await hitungRute();
    }
  });

  async function hitungRute(){
    if(!A || !B) return;
    const [lat1,lng1]=[A.getLatLng().lat,A.getLatLng().lng];
    const [lat2,lng2]=[B.getLatLng().lat,B.getLatLng().lng];
    const url=`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
    try{
      const res=await fetch(url);
      const data=await res.json();
      if(data.routes && data.routes[0]){
        const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distanceKm=(data.routes[0].distance/1000).toFixed(2);
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline(coords,{color:'#0099cc',weight:6}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        updateFare();
      }
    }catch{alert('Gagal menghitung rute. Coba lagi.');}
  }

  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const tarifPerKm=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarifPerKm);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  function resetMap(){
    [A,B,routeLine].forEach(l=>l&&map.removeLayer(l));
    A=B=routeLine=null;
    ['pickup','destination','distance','fare'].forEach(id=>document.getElementById(id).value='');
  }

  function nextStep(){
    if(!A || !B){alert('Pilih Penjemputan & Tujuan terlebih dahulu');return;}
    if(!document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    if(!document.getElementById('wa').value.trim()){alert('Isi nomor WhatsApp');return;}
    document.getElementById('drivers').style.display='block';
  }

  function chat(no,nama){
    const namaPen=document.getElementById('nama').value;
    const waPen=document.getElementById('wa').value;
    const catatan=document.getElementById('catatan').value;
    const total=document.getElementById('fare').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const text=`Halo ${nama}, saya ${namaPen} (${waPen})\n\nIngin pesan ojek NOS:\nKendaraan: ${vehicle}\nJarak: ${distanceKm} km\nTotal: ${total}\nCatatan: ${catatan}`;
    window.open(`https://wa.me/${no}?text=${encodeURIComponent(text)}`);
  }

  window.onload=()=>document.getElementById('loader').style.display='none';
</script>
</body>
</html>
