<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>NOS Situbondo – Pilih Titik & Hitung Jarak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Reset & base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background:#f8f9fa; color:#333; line-height:1.6; }
    h1, h2, h3 { color:#1a365d; }

    /* Layout */
    .wrapper { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .header { text-align:center; margin-bottom:1rem; }
    .header h2 { margin-bottom:.3rem; }
    .header p { color:#666; }

    /* Form */
    .form { background:#fff; padding:1rem; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08); margin-bottom:1rem; }
    label { display:block; margin:.5rem 0 .2rem; font-weight:600; }
    input { width:100%; padding:.7rem; border:1px solid #ccc; border-radius:6px; font-size:1rem; }
    .btn-row { display:flex; gap:.5rem; margin-top:.5rem; }
    .btn { background:#e67e22; color:#fff; border:none; padding:.6rem 1rem; border-radius:6px; cursor:pointer; transition:.2s; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 2px 6px rgba(0,0,0,.2); }

    /* Jarak */
    #distance { font-weight:700; font-size:1.2rem; color:#1a365d; margin:.5rem 0; }

    /* Peta */
    #map { height: 70vh; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
  </style>
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <h2>NOS Situbondo – Pilih Titik & Hitung Jarak</h2>
      <p>Klik dua kali pada peta untuk memilih titik A (pickup) dan titik B (destination)</p>
    </header>

    <div class="form">
      <label>Pickup (Titik A)</label>
      <input id="pickup" readonly placeholder="Klik di peta untuk memilih titik A" />

      <label>Destination (Titik B)</label>
      <input id="destination" readonly placeholder="Klik lagi untuk memilih titik B" />

      <div id="distance">Jarak: – km</div>

      <div class="btn-row">
        <button class="btn" onclick="resetAll()">Reset Titik</button>
        <button class="btn" onclick="sendOrder()">Pesan via WhatsApp</button>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* === 1. Peta: wilayah Situbondo City === */
    const situbondoBounds = [
      [-7.74, 113.98], // [south-west]
      [-7.68, 114.04]  // [north-east]
    ];

    const map = L.map('map', {
      center: [-7.7058, 114.0094],
      zoom: 14,
      maxBounds: situbondoBounds,
      minZoom: 13,
      maxZoom: 18
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    /* === 2. Variabel titik & garis === */
    let pointA = null;
    let pointB = null;
    let routeLine = null;

    /* === 3. Klik untuk memilih titik === */
    map.on('click', function (e) {
      const { lat, lng } = e.latlng;

      if (!pointA) {
        pointA = L.marker([lat, lng]).addTo(map).bindPopup('Titik A – Pickup').openPopup();
        document.getElementById('pickup').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      } else if (!pointB) {
        pointB = L.marker([lat, lng]).addTo(map).bindPopup('Titik B – Destination').openPopup();
        document.getElementById('destination').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

        // Gambar garis & hitung jarak
        routeLine = L.polyline([pointA.getLatLng(), pointB.getLatLng()], { color: 'red', weight: 4 }).addTo(map);
        const distanceKm = map.distance(pointA.getLatLng(), pointB.getLatLng()) / 1000;
        document.getElementById('distance').textContent = `Jarak: ${distanceKm.toFixed(2)} km`;
      }
    });

    /* === 4. Reset semua === */
    function resetAll() {
      if (pointA) { map.removeLayer(pointA); pointA = null; }
      if (pointB) { map.removeLayer(pointB); pointB = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      document.getElementById('pickup').value = '';
      document.getElementById('destination').value = '';
      document.getElementById('distance').textContent = 'Jarak: – km';
    }

    /* === 5. Kirim pesan WhatsApp === */
    function sendOrder() {
      const pickup = document.getElementById('pickup').value.trim();
      const dest   = document.getElementById('destination').value.trim();
      if (!pickup || !dest) {
        alert('Silakan pilih kedua titik terlebih dahulu.');
        return;
      }
      const msg = `PESANAN OJEK NOS\n\nPickup: ${pickup}\nDestination: ${dest}\nJarak: ${document.getElementById('distance').textContent}`;
      window.open(`https://wa.me/6285647709114?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
