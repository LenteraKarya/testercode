<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS Desa – SUPER FINAL LENGKAP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* === DESIGN SYSTEM === */
    :root{
      --sea:#0088ff;
      --sea-dark:#006fd6;
      --coral:#ff4757;
      --glass:rgba(255,255,255,.3);
      --glass-border:rgba(255,255,255,.2);
      --shadow:0 10px 40px rgba(31,38,135,.2);
      --radius:20px;
      --font:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    }
    [data-theme="dark"]{
      --glass:rgba(18,18,18,.45);
      --glass-border:rgba(255,255,255,.08);
      --shadow:0 10px 40px rgba(0,0,0,.4);
    }
    *,*::before,*::after{box-sizing:border-box;padding:0;margin:0}
    body{
      font-family:var(--font);
      background:linear-gradient(135deg,#74b9ff,#0984e3);
      color:#222;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      transition:background .4s,color .4s;
    }
    [data-theme="dark"] body{background:linear-gradient(135deg,#2d3436,#000);color:#eee}
    header{position:sticky;top:0;z-index:1000;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);padding:.75rem 1rem;text-align:center}
    header h1{font-size:1.4rem;font-weight:700}
    .toggle-theme{position:absolute;top:.8rem;right:1rem;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--sea)}
    .container{max-width:900px;margin:0 auto;padding:1rem}
    .glass-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem;margin-bottom:1rem;backdrop-filter:blur(12px)}
    label{font-size:.9rem;font-weight:600;margin:.4rem 0 .2rem;display:block;color:var(--sea-dark)}
    input,textarea{width:100%;padding:.8rem;border:none;border-radius:14px;background:rgba(255,255,255,.75);font-size:.95rem}
    [data-theme="dark"] input,[data-theme="dark"] textarea{background:rgba(255,255,255,.1);color:#fff}
    .btn-group{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
    .btn{flex:1 1 150px;padding:.8rem 1rem;border:none;border-radius:25px;font-weight:700;cursor:pointer;font-size:.85rem}
    .btn-primary{background:var(--sea);color:#fff;box-shadow:0 4px 14px rgba(0,136,255,.45)}
    .btn-danger{background:var(--coral);color:#fff}
    #map{height:65vh;border-radius:var(--radius);box-shadow:var(--shadow)}
    .tile-row{display:flex;gap:.8rem;justify-content:center;margin:.8rem 0}
    .tile{flex:1 1 120px;max-width:180px;padding:1.2rem 1rem;border:2px solid transparent;border-radius:var(--radius);text-align:center;cursor:pointer;transition:border .3s,transform .2s;background:var(--glass)}
    .tile.selected{border-color:var(--sea);transform:scale(1.05)}
    .tile i{font-size:2.2rem;margin-bottom:.4rem;color:var(--sea)}
    .tile span{font-weight:700;font-size:1rem}
    .tile input{display:none}
    .poi-btn-row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.8rem 0}
    .poi-btn{padding:.5rem 1rem;border:none;border-radius:20px;background:#fff;color:var(--sea);font-size:.75rem;cursor:pointer;transition:background .3s,color .3s}
    .poi-btn:hover{background:var(--sea);color:#fff}
    .driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
    .driver-card{background:var(--glass);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .3s}
    .driver-card:hover{transform:scale(1.05)}
    .driver-card img{width:100%;height:120px;object-fit:cover}
    .driver-info{padding:.8rem;font-size:.85rem}
    .driver-info .name{font-weight:700;font-size:1rem}
    .driver-info .rating{color:var(--coral);margin:.3rem 0}
    .driver-info .plate{background:rgba(255,255,255,.3);border-radius:8px;padding:.3rem .6rem;font-weight:600}
    .bottom-sheet{position:fixed;bottom:0;left:0;right:0;z-index:1001;background:var(--glass);backdrop-filter:blur(15px);border-top:1px solid var(--glass-border);border-radius:var(--radius) var(--radius) 0 0;padding:1.2rem;transform:translateY(100%);transition:transform .4s;max-height:80vh;overflow-y:auto}
    .bottom-sheet.show{transform:translateY(0)}
    .shimmer{position:relative;overflow:hidden;background:#e0e0e0}
    [data-theme="dark"] .shimmer{background:#333}
    .shimmer::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shimmer 1.5s infinite}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    .loading{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #reverseRoute{background:none;border:none;color:var(--sea);font-size:1.2rem;cursor:pointer;position:absolute;right:10px;top:50%;transform:translateY(-50%)}
    .route-info{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.85rem}
    .route-info span{color:var(--sea-dark);font-weight:600}
    [data-theme="dark"] .route-info span{color:#74b9ff}
  </style>
</head>
<body>
<header>
  <h1><i class="fa-solid fa-motorcycle"></i> NOS Desa – SUPER FINAL LENGKAP</h1>
  <button class="toggle-theme" id="toggleTheme" title="Ganti tema"><i class="fa-solid fa-circle-half-stroke"></i></button>
</header>

<div class="container">
  <!-- Peta + search -->
  <div class="glass-card">
    <label><i class="fa-solid fa-search"></i> Cari alamat, desa, SPBU, sekolah…</label>
    <input id="searchBox" type="text" placeholder="Ketik nama jalan, desa, SPBU, sekolah…"/>
    <div id="map"></div>
  </div>

  <!-- Detail rute -->
  <div class="glass-card" style="position:relative">
    <label>Penjemputan</label>
    <input id="pickup" readonly placeholder="Belum dipilih"/>
    <label>Tujuan</label>
    <input id="destination" readonly placeholder="Belum dipilih"/>
    <button id="reverseRoute" title="Balikkan rute"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
    <div class="route-info">
      <span>Jarak via jalan raya: <span id="distance">0 km</span></span>
      <span>Estimasi Tarif: <span id="fare">Rp 0</span></span>
    </div>
  </div>

  <!-- Kendaraan -->
  <div class="glass-card">
    <label><i class="fa-solid fa-truck-pickup"></i> Pilih Kendaraan</label>
    <div class="tile-row">
      <label class="tile selected">
        <input type="radio" name="vehicle" value="motor" checked/>
        <i class="fa-solid fa-motorcycle"></i><br>Motor
      </label>
      <label class="tile">
        <input type="radio" name="vehicle" value="mobil"/>
        <i class="fa-solid fa-car-side"></i><br>Mobil
      </label>
    </div>
  </div>

  <!-- Penumpang 1-2 orang -->
  <div class="glass-card">
    <label><i class="fa-solid fa-users"></i> Jumlah Penumpang</label>
    <div class="tile-row">
      <label class="tile selected">
        <input type="radio" name="passengers" value="1" checked/>
        <span>1 Orang</span>
      </label>
      <label class="tile">
        <input type="radio" name="passengers" value="2"/>
        <span>2 Orang</span>
      </label>
    </div>
  </div>

  <!-- Data penumpang -->
  <div class="glass-card">
    <label><i class="fa-solid fa-user-check"></i> Data Penumpang</label>
    <input id="nama" placeholder="Nama lengkap"/>
    <input id="wa" placeholder="Nomor WhatsApp (08/62)" type="tel" maxlength="13"/>
    <textarea id="catatan" rows="3" placeholder="Catatan tambahan (maks 300 karakter)" maxlength="300"></textarea>
    <div id="charCount" style="font-size:.7rem;text-align:right">0 / 300</div>
  </div>

  <!-- POI Sekitar -->
  <div class="glass-card">
    <label><i class="fa-solid fa-map-pin"></i> Tampilkan POI di sekitar</label>
    <div class="poi-btn-row">
      <button class="poi-btn" onclick="showPOI('amenity','fuel')">SPBU</button>
      <button class="poi-btn" onclick="showPOI('amenity','school')">Sekolah</button>
      <button class="poi-btn" onclick="showPOI('shop','convenience')">Minimarket</button>
      <button class="poi-btn" onclick="showPOI('amenity','place_of_worship')">Masjid/Gereja</button>
      <button class="poi-btn" onclick="showPOI('amenity','restaurant')">Warung</button>
      <button class="poi-btn" onclick="showPOI('tourism','attraction')">Wisata</button>
    </div>
  </div>

  <!-- CTA -->
  <div class="btn-group">
    <button class="btn btn-primary" onclick="getCurrentLocation()"><i class="fa-solid fa-location-crosshairs"></i> Lokasi Saya</button>
    <button class="btn btn-primary" onclick="nextStep()"><i class="fa-brands fa-whatsapp"></i> Lanjut Pilih Driver</button>
    <button class="btn btn-danger" onclick="resetMap()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
  </div>
</div>

<!-- Shimmer skeleton -->
<div id="shimmerCard" class="glass-card" style="display:none">
  <div class="driver-grid">
    <div class="driver-card shimmer"><div style="height:120px"></div></div>
    <div class="driver-card shimmer"><div style="height:120px"></div></div>
    <div class="driver-card shimmer"><div style="height:120px"></div></div>
  </div>
</div>

<!-- Driver list -->
<div id="driversCard" class="glass-card" style="display:none">
  <label><i class="fa-solid fa-id-card"></i> Pilih Driver</label>
  <div id="drivers" class="driver-grid"></div>
</div>

<!-- Bottom sheet -->
<div id="summarySheet" class="bottom-sheet">
  <h3><i class="fa-solid fa-clipboard-check"></i> Ringkasan Pesanan</h3>
  <p><strong>Nama:</strong> <span id="sumNama"></span></p>
  <p><strong>Kendaraan:</strong> <span id="sumVehicle"></span></p>
  <p><strong>Penumpang:</strong> <span id="sumPassengers"></span></p>
  <p><strong>Jarak:</strong> <span id="sumDistance"></span></p>
  <p><strong>Estimasi:</strong> <span id="sumFare"></span></p>
  <p><strong>Catatan:</strong> <span id="sumCatatan"></span></p>
  <button class="btn btn-primary" id="btnChat" style="width:100%"><i class="fa-brands fa-whatsapp"></i> Kirim ke WhatsApp</button>
</div>

<!-- JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.76.1/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
<script>
  /* === KONFIGURASI AWAL === */
  const TARIF_MOTOR = 1500; // Tarif per km untuk motor
  const TARIF_MOBIL = 3000; // Tarif per km untuk mobil
  const bounds = [[-8.8, 111.8], [-6.8, 115.8]]; // Batas peta Jawa Timur
  
  // Inisialisasi peta dengan view Jawa Timur
  const map = L.map('map', {
    center: [-7.5, 113],
    zoom: 11,
    minZoom: 9,
    maxZoom: 19,
    maxBounds: bounds,
    maxBoundsViscosity: 1.0
  });

  // Tambahkan tile layer OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  /* Inisialisasi Routing Machine */
  const routingControl = L.Routing.control({
    waypoints: [],
    routeWhileDragging: true,
    showAlternatives: false,
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true,
    show: false, // Sembunyikan panel rute default
    lineOptions: {
      styles: [{color: '#0088ff', opacity: 0.8, weight: 6}]
    },
    createMarker: function() { return null; } // Nonaktifkan marker default
  }).addTo(map);

  /* Geocoder untuk pencarian alamat */
  const geocoder = L.Control.Geocoder.nominatim({
    geocodingQueryParams: {
      countrycodes: 'id',
      viewbox: '111.8,-8.8,115.8,-6.8',
      bounded: 1
    }
  });

  // Tambahkan kontrol geocoder ke peta
  L.Control.geocoder({
    geocoder,
    collapsed: false,
    placeholder: 'Cari jalan, desa, SPBU, sekolah…',
    defaultMarkGeocode: false
  }).on('markgeocode', function(e) {
    const { center, name } = e.geocode;
    
    if (!originMarker) {
      // Jika belum ada penjemputan, set sebagai penjemputan
      setOrigin(center, name);
    } else if (!destMarker) {
      // Jika sudah ada penjemputan tapi belum tujuan, set sebagai tujuan
      setDestination(center, name);
    } else {
      // Jika keduanya sudah ada, ganti tujuan
      map.removeLayer(destMarker);
      setDestination(center, name);
    }
    
    map.setView(center, 15);
  }).addTo(map);

  // Tambahkan kontrol lokasi
  L.control.locate({
    position: 'topright',
    strings: {
      title: 'Lokasi saya'
    },
    locateOptions: {
      maxZoom: 16,
      enableHighAccuracy: true
    }
  }).addTo(map);

  /* State aplikasi */
  let originMarker = null;
  let destMarker = null;
  let distanceKm = 0;
  let isCalculatingRoute = false;
  
  const driverList = [
    {name: "Budi Santoso", wa: "6285647709114", img: "1", plat: "S 1234 JI", rating: 4.9},
    {name: "Ani Wijaya", wa: "6285647709115", img: "2", plat: "N 5678 AT", rating: 4.8},
    {name: "Rizky Pratama", wa: "6285647709116", img: "3", plat: "L 9012 TM", rating: 4.7},
    {name: "Dewi Lestari", wa: "6285647709117", img: "4", plat: "S 3456 AB", rating: 4.85},
    {name: "Eko Prasetyo", wa: "6285647709118", img: "5", plat: "N 7890 CD", rating: 4.75}
  ];
  
  let poiLayer = null;

  /* Fungsi untuk menetapkan titik penjemputan */
  function setOrigin(latlng, name) {
    if (originMarker) {
      map.removeLayer(originMarker);
    }
    
    originMarker = L.marker(latlng, {
      icon: L.divIcon({
        className: 'custom-marker',
        html: '<i class="fa-solid fa-circle-dot" style="color:#0088ff;font-size:24px"></i>',
        iconSize: [24, 24],
        iconAnchor: [12, 24]
      })
    }).addTo(map).bindPopup(`<b>Penjemputan</b><br>${name || 'Lokasi penjemputan'}`).openPopup();
    
    document.getElementById('pickup').value = name || `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
    
    // Update rute jika sudah ada tujuan
    if (destMarker) {
      updateRoute();
    }
  }

  /* Fungsi untuk menetapkan titik tujuan */
  function setDestination(latlng, name) {
    if (destMarker) {
      map.removeLayer(destMarker);
    }
    
    destMarker = L.marker(latlng, {
      icon: L.divIcon({
        className: 'custom-marker',
        html: '<i class="fa-solid fa-location-dot" style="color:#ff4757;font-size:24px"></i>',
        iconSize: [24, 24],
        iconAnchor: [12, 24]
      })
    }).addTo(map).bindPopup(`<b>Tujuan</b><br>${name || 'Lokasi tujuan'}`).openPopup();
    
    document.getElementById('destination').value = name || `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
    
    // Update rute jika sudah ada penjemputan
    if (originMarker) {
      updateRoute();
    }
  }

  /* Fungsi untuk memperbarui rute */
  function updateRoute() {
    if (!originMarker || !destMarker) return;
    
    isCalculatingRoute = true;
    document.getElementById('distance').textContent = 'Menghitung...';
    document.getElementById('fare').textContent = 'Menghitung...';
    
    // Set waypoints untuk routing control
    routingControl.setWaypoints([
      L.latLng(originMarker.getLatLng()),
      L.latLng(destMarker.getLatLng())
    ]);
    
    // Event ketika rute selesai dihitung
    routingControl.on('routesfound', function(e) {
      const routes = e.routes;
      if (routes && routes.length > 0) {
        const route = routes[0];
        distanceKm = (route.summary.totalDistance / 1000).toFixed(2);
        updateFare();
      }
      isCalculatingRoute = false;
    });
    
    // Event ketika terjadi error
    routingControl.on('routingerror', function(e) {
      console.error('Routing error:', e.error);
      alert('Gagal menghitung rute. Silakan coba lokasi yang berbeda.');
      document.getElementById('distance').textContent = '0 km';
      document.getElementById('fare').textContent = 'Rp 0';
      isCalculatingRoute = false;
    });
  }

  /* Fungsi untuk membalikkan rute */
  document.getElementById('reverseRoute').addEventListener('click', function() {
    if (originMarker && destMarker) {
      const originLatLng = originMarker.getLatLng();
      const destLatLng = destMarker.getLatLng();
      const originName = document.getElementById('pickup').value;
      const destName = document.getElementById('destination').value;
      
      // Hapus marker yang ada
      map.removeLayer(originMarker);
      map.removeLayer(destMarker);
      
      // Set marker baru dengan posisi terbalik
      setOrigin(destLatLng, destName);
      setDestination(originLatLng, originName);
    }
  });

  /* Fungsi untuk memperbarui tarif berdasarkan jarak */
  function updateFare() {
    const vehicle = document.querySelector('input[name="vehicle"]:checked').value;
    const passengers = parseInt(document.querySelector('input[name="passengers"]:checked').value);
    const tarif = vehicle === 'motor' ? TARIF_MOTOR : TARIF_MOBIL;
    const total = Math.round(distanceKm * tarif * passengers);
    
    document.getElementById('distance').textContent = distanceKm + ' km';
    document.getElementById('fare').textContent = 'Rp ' + total.toLocaleString('id-ID');
  }

  /* Event listener untuk perubahan kendaraan dan penumpang */
  document.querySelectorAll('input[name="vehicle"], input[name="passengers"]').forEach(input => {
    input.addEventListener('change', updateFare);
  });

  /* Event klik pada peta */
  map.on('click', function(e) {
    if (!originMarker) {
      setOrigin(e.latlng, 'Lokasi penjemputan');
    } else if (!destMarker) {
      setDestination(e.latlng, 'Lokasi tujuan');
    } else {
      // Jika kedua titik sudah ada, ganti tujuan
      map.removeLayer(destMarker);
      setDestination(e.latlng, 'Lokasi tujuan');
    }
  });

  /* Fungsi untuk mendapatkan lokasi saat ini */
  function getCurrentLocation() {
    if (navigator.geolocation) {
      // Tampilkan indikator loading
      const btn = document.querySelector('[onclick="getCurrentLocation()"]');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="loading"></span> Mendeteksi lokasi...';
      btn.disabled = true;
      
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 15);
          
          if (!originMarker) {
            setOrigin([latitude, longitude], 'Lokasi saya');
          } else {
            // Jika sudah ada penjemputan, set sebagai tujuan
            if (!destMarker) {
              setDestination([latitude, longitude], 'Lokasi tujuan');
            } else {
              // Jika keduanya sudah ada, tanya pengguna
              if (confirm('Ganti lokasi penjemputan dengan lokasi saat ini?')) {
                setOrigin([latitude, longitude], 'Lokasi saya');
              }
            }
          }
          
          // Kembalikan tombol ke state semula
          btn.innerHTML = originalHtml;
          btn.disabled = false;
        },
        function(err) {
          alert('Gagal mendapatkan lokasi: ' + err.message);
          btn.innerHTML = originalHtml;
          btn.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    } else {
      alert('Browser tidak mendukung geolokasi');
    }
  }

  /* Fungsi untuk mereset peta */
  function resetMap() {
    // Hapus semua layer dari peta
    [originMarker, destMarker, poiLayer].forEach(layer => {
      if (layer) map.removeLayer(layer);
    });
    
    // Reset routing control
    routingControl.setWaypoints([]);
    
    // Reset state
    originMarker = destMarker = poiLayer = null;
    distanceKm = 0;
    
    // Reset form
    document.getElementById('pickup').value = '';
    document.getElementById('destination').value = '';
    document.getElementById('distance').textContent = '0 km';
    document.getElementById('fare').textContent = 'Rp 0';
    document.getElementById('nama').value = '';
    document.getElementById('wa').value = '';
    document.getElementById('catatan').value = '';
    document.getElementById('charCount').textContent = '0 / 300';
    document.getElementById('shimmerCard').style.display = 'none';
    document.getElementById('driversCard').style.display = 'none';
    document.getElementById('summarySheet').classList.remove('show');
    
    // Reset pilihan kendaraan dan penumpang
    document.querySelectorAll('.tile').forEach(tile => {
      tile.classList.remove('selected');
    });
    document.querySelector('.tile input[value="motor"]').parentElement.classList.add('selected');
    document.querySelector('.tile input[value="1"]').parentElement.classList.add('selected');
    
    // Kembalikan view peta ke default
    map.setView([-7.5, 113], 11);
  }

  /* Validasi nomor WhatsApp */
  function validateWA(num) {
    return /^(08|62)\d{8,11}$/.test(num.trim());
  }

  /* Fungsi untuk menampilkan POI */
  function showPOI(key, val) {
    if (poiLayer) {
      map.removeLayer(poiLayer);
      poiLayer = null;
    }
    
    const bbox = map.getBounds().toBBoxString();
    const query = `[out:json][timeout:25];(node["${key}"="${val}"](${bbox});way["${key}"="${val}"](${bbox}););out center;`;
    
    fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: query
    })
    .then(res => res.json())
    .then(data => {
      poiLayer = L.layerGroup().addTo(map);
      
      data.elements.forEach(el => {
        const lat = el.type === 'node' ? el.lat : el.center.lat;
        const lng = el.type === 'node' ? el.lon : el.center.lon;
        
        L.marker([lat, lng], {
          icon: L.divIcon({
            className: 'poi-marker',
            html: `<i class="fa-solid fa-map-marker-alt" style="color:#ff4757;font-size:20px"></i>`,
            iconSize: [20, 20],
            iconAnchor: [10, 20]
          })
        })
        .addTo(poiLayer)
        .bindPopup(el.tags?.name || val);
      });
    })
    .catch(err => {
      console.error('Error fetching POI:', err);
      alert('Gagal memuat POI. Silakan coba lagi.');
    });
  }

  /* Fungsi untuk lanjut ke pemilihan driver */
  async function nextStep() {
    if (!originMarker || !destMarker) {
      alert('Harap pilih titik penjemputan dan tujuan terlebih dahulu');
      return;
    }
    
    if (!document.getElementById('nama').value.trim()) {
      alert('Harap isi nama lengkap');
      return;
    }
    
    const wa = document.getElementById('wa').value.trim();
    if (!validateWA(wa)) {
      alert('Nomor WhatsApp harus diawali 08/62 dan terdiri dari 10-13 digit angka');
      return;
    }
    
    if (isCalculatingRoute) {
      alert('Harap tunggu hingga perhitungan rute selesai');
      return;
    }
    
    if (distanceKm <= 0) {
      alert('Harap pastikan rute sudah terhitung dengan benar');
      return;
    }
    
    // Tampilkan loading skeleton
    document.getElementById('shimmerCard').style.display = 'block';
    document.getElementById('driversCard').style.display = 'none';
    
    // Simulasikan loading data driver
    await new Promise(resolve => setTimeout(resolve, 800));
    
    // Sembunyikan loading dan tampilkan driver
    document.getElementById('shimmerCard').style.display = 'none';
    renderDrivers();
    document.getElementById('driversCard').style.display = 'block';
    
    // Scroll ke bagian driver
    document.getElementById('driversCard').scrollIntoView({ behavior: 'smooth' });
  }

  /* Fungsi untuk merender daftar driver */
  function renderDrivers() {
    const container = document.getElementById('drivers');
    container.innerHTML = '';
    
    // Acak urutan driver untuk variasi
    const shuffledDrivers = [...driverList].sort(() => Math.random() - 0.5);
    
    shuffledDrivers.forEach(d => {
      const div = document.createElement('div');
      div.className = 'driver-card';
      div.innerHTML = `
        <img src="https://i.pravatar.cc/300?img=${d.img}" alt="${d.name}" loading="lazy">
        <div class="driver-info">
          <div class="name">${d.name}</div>
          <div class="rating"><i class="fa-solid fa-star"></i> ${d.rating}</div>
          <div class="plate">${d.plat}</div>
          <button class="btn btn-primary" onclick="selectDriver('${d.wa}','${d.name}')">Pilih Driver</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  /* Fungsi untuk memilih driver */
  function selectDriver(no, nama) {
    const namaPen = document.getElementById('nama').value;
    const vehicle = document.querySelector('input[name="vehicle"]:checked').value;
    const passengers = document.querySelector('input[name="passengers"]:checked').value;
    const catatan = document.getElementById('catatan').value;
    const fare = document.getElementById('fare').textContent;
    const pickup = document.getElementById('pickup').value;
    const destination = document.getElementById('destination').value;
    const distance = document.getElementById('distance').textContent;
    
    // Update ringkasan pesanan
    document.getElementById('sumNama').textContent = namaPen;
    document.getElementById('sumVehicle').textContent = vehicle === 'motor' ? 'Motor' : 'Mobil';
    document.getElementById('sumPassengers').textContent = passengers + ' orang';
    document.getElementById('sumDistance').textContent = distance;
    document.getElementById('sumFare').textContent = fare;
    document.getElementById('sumCatatan').textContent = catatan || '-';
    
    // Sembunyikan daftar driver dan tampilkan ringkasan
    document.getElementById('driversCard').style.display = 'none';
    document.getElementById('summarySheet').classList.add('show');
    
    // Format pesan WhatsApp
    const text = `Halo ${nama}, saya ${namaPen}\n\n` +
                 `Saya ingin memesan layanan NOS dengan detail berikut:\n` +
                 `• Kendaraan: ${vehicle === 'motor' ? 'Motor' : 'Mobil'}\n` +
                 `• Penumpang: ${passengers} orang\n` +
                 `• Penjemputan: ${pickup}\n` +
                 `• Tujuan: ${destination}\n` +
                 `• Jarak: ${distance}\n` +
                 `• Estimasi tarif: ${fare}\n` +
                 `${catatan ? `• Catatan: ${catatan}\n` : ''}\n` +
                 `Apakah Anda bisa menerima pesanan ini?`;
    
    // Set event handler untuk tombol WhatsApp
    document.getElementById('btnChat').onclick = () => {
      window.open(`https://wa.me/${no}?text=${encodeURIComponent(text)}`, '_blank');
    };
  }

  /* Event listener untuk textarea catatan */
  document.getElementById('catatan').addEventListener('input', function(e) {
    document.getElementById('charCount').textContent = e.target.value.length + ' / 300';
  });

  /* Event listener untuk toggle theme */
  const html = document.documentElement;
  const toggleBtn = document.getElementById('toggleTheme');
  
  toggleBtn.onclick = function() {
    const isDark = html.dataset.theme === 'dark';
    html.dataset.theme = isDark ? '' : 'dark';
    localStorage.setItem('theme', html.dataset.theme);
    toggleBtn.innerHTML = `<i class="fa-solid ${isDark ? 'fa-moon' : 'fa-sun'}"></i>`;
  };

  /* Inisialisasi tema */
  (function() {
    const saved = localStorage.getItem('theme');
    const hour = new Date().getHours();
    
    // Prioritaskan tema yang disimpan pengguna
    if (saved) {
      html.dataset.theme = saved;
    } 
    // Jika tidak ada preferensi, gunakan dark mode pada malam hari
    else if (hour >= 18 || hour < 6) {
      html.dataset.theme = 'dark';
    }
    
    // Set ikon toggle sesuai tema
    toggleBtn.innerHTML = `<i class="fa-solid ${html.dataset.theme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i>`;
  })();

  /* Event listener untuk pilihan kendaraan dan penumpang */
  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', function() {
      // Hapus class selected dari semua tile dalam grup yang sama
      const groupName = this.querySelector('input').name;
      document.querySelectorAll(`.tile input[name="${groupName}"]`).forEach(input => {
        input.parentElement.classList.remove('selected');
      });
      
      // Tambahkan class selected ke tile yang diklik
      this.classList.add('selected');
      
      // Jika ini pilihan kendaraan atau penumpang, update tarif
      if (groupName === 'vehicle' || groupName === 'passengers') {
        updateFare();
      }
    });
  });
</script>
</body>
