<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOS | Ojek Online Situbondo - Tanpa Google API</title>
    <meta name="description" content="Pesan ojek online di Situbondo tanpa API key. Lengkap dengan peta interaktif dan database lokasi lengkap.">
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #1a365d;
            --accent: #e67e22;
            --light: #f8f9fa;
            --text: #4a5568;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light);
            color: var(--text);
            line-height: 1.7;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .section-title {
            text-align: center;
            margin: 2rem 0;
            font-size: 2.5rem;
            color: var(--primary);
        }
        .booking-form-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            margin: 2rem 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .map-container { height: 400px; border-radius: 16px; overflow: hidden; margin-bottom: 1rem; }
        .location-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .location-btn {
            padding: 0.8rem 1rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-size: 0.9rem;
        }
        .location-btn:hover { background: var(--accent); color: white; }
        .search-input {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .category-title {
            font-weight: 600;
            margin: 1rem 0 0.5rem 0;
            color: var(--primary);
        }
        @media (max-width: 768px) {
            .location-options { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<!-- Order Section -->
<section id="order" class="booking">
    <div class="container">
        <h2 class="section-title">Pesan Ojek Online</h2>
        <div class="booking-form-container">
            
            <!-- Peta Interaktif -->
            <div class="map-container" id="map"></div>
            
            <!-- Form -->
            <form id="orderForm">
                <div class="form-group">
                    <label>Lokasi Penjemputan *</label>
                    <input type="text" id="pickupLocation" class="search-input" placeholder="Ketik atau pilih lokasi..." required>
                    <div id="pickupOptions"></div>
                </div>
                
                <div class="form-group">
                    <label>Tujuan *</label>
                    <input type="text" id="destinationLocation" class="search-input" placeholder="Ketik atau pilih lokasi..." required>
                    <div id="destinationOptions"></div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-motorcycle"></i> Pesan Sekarang
                </button>
            </form>
        </div>
    </div>
</section>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ======================
// DATABASE LOKASI LENGKAP
// ======================
const locations = [
    // Kecamatan Situbondo
    {name: "Alun-Alun Situbondo", lat: -7.7061, lng: 114.0094, category: "Taman"},
    {name: "Kantor Bupati Situbondo", lat: -7.7058, lng: 114.0089, category: "Kantor"},
    {name: "RSUD Kanjuruhan Situbondo", lat: -7.7044, lng: 114.0122, category: "Rumah Sakit"},
    {name: "Pasar Situbondo", lat: -7.7089, lng: 114.0083, category: "Pasar"},
    
    // Kecamatan Panarukan
    {name: "Pasar Panarukan", lat: -7.6694, lng: 113.9678, category: "Pasar"},
    {name: "SPBU Panarukan", lat: -7.6689, lng: 113.9689, category: "SPBU"},
    {name: "SMA Negeri 1 Panarukan", lat: -7.6702, lng: 113.9667, category: "Sekolah"},
    
    // Kecamatan Mangaran
    {name: "Pasar Mangaran", lat: -7.6492, lng: 114.0036, category: "Pasar"},
    {name: "Puskesmas Mangaran", lat: -7.6501, lng: 114.0044, category: "Puskesmas"},
    {name: "SDN Mangaran 1", lat: -7.6498, lng: 114.0028, category: "Sekolah"},
    
    // Kecamatan Besuki
    {name: "Pasar Besuki", lat: -7.7311, lng: 113.9278, category: "Pasar"},
    {name: "SPBU Besuki", lat: -7.7305, lng: 113.9289, category: "SPBU"},
    {name: "Pantai Boom Besuki", lat: -7.7294, lng: 113.9256, category: "Wisata"},
    
    // Kecamatan Jangkar
    {name: "Pasar Jangkar", lat: -7.6917, lng: 113.8756, category: "Pasar"},
    {name: "Puskesmas Jangkar", lat: -7.6908, lng: 113.8767, category: "Puskesmas"},
    {name: "Tugu Jangkar", lat: -7.6922, lng: 113.8772, category: "Tugu"},
    
    // Kecamatan Asembagus
    {name: "Pasar Asembagus", lat: -7.7642, lng: 113.8467, category: "Pasar"},
    {name: "SPBU Asembagus", lat: -7.7639, lng: 113.8478, category: "SPBU"},
    {name: "Pantai Pasir Putih Asembagus", lat: -7.7656, lng: 113.8456, category: "Wisata"},
    
    // Kecamatan Kendit
    {name: "Pasar Kendit", lat: -7.7167, lng: 114.1234, category: "Pasar"},
    {name: "Puskesmas Kendit", lat: -7.7156, lng: 114.1245, category: "Puskesmas"},
    {name: "SDN Kendit 1", lat: -7.7161, lng: 114.1239, category: "Sekolah"},
    
    // Kecamatan Arjasa
    {name: "Pasar Arjasa", lat: -7.6944, lng: 114.0978, category: "Pasar"},
    {name: "SPBU Arjasa", lat: -7.6939, lng: 114.0989, category: "SPBU"},
    {name: "Pantai Popoh Arjasa", lat: -7.6956, lng: 114.0967, category: "Wisata"},
    
    // Kecamatan Mlandingan
    {name: "Pasar Mlandingan", lat: -7.7456, lng: 114.0789, category: "Pasar"},
    {name: "Puskesmas Mlandingan", lat: -7.7445, lng: 114.0798, category: "Puskesmas"},
    {name: "SMA Negeri 1 Mlandingan", lat: -7.7451, lng: 114.0782, category: "Sekolah"},
    
    // Kecamatan Banyuglugur
    {name: "Pasar Banyuglugur", lat: -7.7234, lng: 114.1567, category: "Pasar"},

    // Kecamatan Sumbermalang
    {name: "Pasar Sumbermalang", lat: -7.6892, lng: 114.2145, category: "Pasar"},
    {name: "Air Terjun Tancak", lat: -7.6901, lng: 114.2134, category: "Wisata"},
    
    // Kecamatan Jatibanteng
    {name: "Pasar Jatibanteng", lat: -7.7456, lng: 114.2345, category: "Pasar"},
    {name: "Pantai Jatibanteng", lat: -7.7467, lng: 114.2334, category: "Wisata"},
    
    // Kecamatan Bungatan
    {name: "Pasar Bungatan", lat: -7.7654, lng: 114.1890, category: "Pasar"},
    {name: "Pantai Bungatan", lat: -7.7667, lng: 114.1878, category: "Wisata"},
    
    // Kecamatan Kapongan
    {name: "Pasar Kapongan", lat: -7.7234, lng: 114.2789, category: "Pasar"},
    {name: "Pantai Kapongan", lat: -7.7245, lng: 114.2778, category: "Wisata"},
    
    // Kecamatan Banyuputih
    {name: "Pasar Banyuputih", lat: -7.7890, lng: 114.1234, category: "Pasar"},
    {name: "Pantai Banyuputih", lat: -7.7901, lng: 114.1223, category: "Wisata"},
    
    // Kecamatan Suboh
    {name: "Pasar Suboh", lat: -7.8123, lng: 114.0567, category: "Pasar"},
    {name: "Pantai Suboh", lat: -7.8134, lng: 114.0556, category: "Wisata"},
    
    // Kecamatan Pasir Putih
    {name: "Pasar Pasir Putih", lat: -7.8345, lng: 114.0123, category: "Pasar"},
    {name: "Pantai Pasir Putih", lat: -7.8356, lng: 114.0112, category: "Wisata"},
    
    // Minimarket & Rumah Makan
    {name: "Indomaret Situbondo", lat: -7.7067, lng: 114.0089, category: "Minimarket"},
    {name: "Alfamart Panarukan", lat: -7.6697, lng: 113.9689, category: "Minimarket"},
    {name: "RM Apung Situbondo", lat: -7.7056, lng: 114.0094, category: "Rumah Makan"},
    {name: "Warung Makan Panarukan", lat: -7.6689, lng: 113.9678, category: "Rumah Makan"},
    
    // Jembatan & Tugu
    {name: "Jembatan Situbondo", lat: -7.7045, lng: 114.0078, category: "Jembatan"},
    {name: "Jembatan Panarukan", lat: -7.6684, lng: 113.9673, category: "Jembatan"},
    {name: "Tugu Jangkar", lat: -7.6922, lng: 113.8772, category: "Tugu"}
];

// ======================
// INISIALISASI PETA
// ======================
let map, pickupMarker, destinationMarker;

function initMap() {
    map = L.map('map').setView([-7.7058, 114.0094], 12);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    
    // Tambahkan semua marker
    locations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng])
            .addTo(map)
            .bindPopup(`<b>${loc.name}</b><br>${loc.category}`);
        
        marker.on('click', function() {
            setLocation(loc.name, loc.lat, loc.lng);
        });
    });
}

function setLocation(name, lat, lng, type = 'pickup') {
    const input = type === 'pickup' ? document.getElementById('pickupLocation') : document.getElementById('destinationLocation');
    const marker = type === 'pickup' ? pickupMarker : destinationMarker;
    
    input.value = name;
    
    if (marker) map.removeLayer(marker);
    
    const newMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${type === 'pickup' ? 'Penjemputan' : 'Tujuan'}:</b> ${name}`).openPopup();
    
    if (type === 'pickup') pickupMarker = newMarker;
    else destinationMarker = newMarker;
    
    map.setView([lat, lng], 15);
}

// ======================
// SEARCH LOKAL
// ======================
function filterLocations(query, type) {
    const filtered = locations.filter(loc => 
        loc.name.toLowerCase().includes(query.toLowerCase())
    );
    
    const container = type === 'pickup' ? 'pickupOptions' : 'destinationOptions';
    document.getElementById(container).innerHTML = '';
    
    if (query.length < 2) return;
    
    const categories = [...new Set(filtered.map(loc => loc.category))];
    
    categories.forEach(category => {
        const categoryLocs = filtered.filter(loc => loc.category === category);
        if (categoryLocs.length === 0) return;
        
        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = category;
        document.getElementById(container).appendChild(title);
        
        categoryLocs.forEach(loc => {
            const btn = document.createElement('button');
            btn.className = 'location-btn';
            btn.textContent = loc.name;
            btn.onclick = () => setLocation(loc.name, loc.lat, loc.lng, type);
            document.getElementById(container).appendChild(btn);
        });
    });
}

// Event listener untuk input search
document.getElementById('pickupLocation').addEventListener('input', (e) => {
    filterLocations(e.target.value, 'pickup');
});

document.getElementById('destinationLocation').addEventListener('input', (e) => {
    filterLocations(e.target.value, 'destination');
});

// ======================
// FORM SUBMISSION
// ======================
document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const pickup = document.getElementById('pickupLocation').value;
    const destination = document.getElementById('destinationLocation').value;
    
    if (!pickup || !destination) {
        alert('Mohon lengkapi lokasi penjemputan dan tujuan');
        return;
    }
    
    // Kirim ke WhatsApp
    const message = `PESANAN OJEK NOS SITUBONDO\n\nPenjemputan: ${pickup}\nTujuan: ${destination}`;
    const encodedMessage = encodeURIComponent(message);
    window.open(`https://wa.me/6285647709114?text=${encodedMessage}`, '_blank');
});

// ======================
// INISIALISASI
// ======================
window.onload = function() {
    initMap();
};
</script>

</body>
</html>
