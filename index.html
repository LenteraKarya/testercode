<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS Premium – Ojek Online Jawa Timur</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --sea:#0088ff;
      --sea-dark:#005cb8;
      --coral:#ff4757;
      --sand:#f7f7f7;
      --glass:rgba(255,255,255,.25);
      --glass-border:rgba(255,255,255,.18);
      --shadow:0 8px 32px rgba(31,38,135,.25);
      --radius:18px;
      --font:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    }
    [data-theme="dark"]{
      --sand:#121212;
      --glass:rgba(18,18,18,.45);
      --glass-border:rgba(255,255,255,.08);
    }
    *,*::before,*::after{box-sizing:border-box;padding:0;margin:0}
    body{
      font-family:var(--font);
      background:var(--sand);
      color:#222;
      transition:background .4s,color .4s;
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      z-index:-1;
      background:linear-gradient(135deg,#74b9ff,#0984e3);
      opacity:.9;
    }
    [data-theme="dark"] body::before{
      background:linear-gradient(135deg,#2d3436,#000);
    }
    header{
      position:sticky;top:0;z-index:1000;
      background:var(--glass);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--glass-border);
      padding:.75rem 1rem;
      text-align:center;
      box-shadow:var(--shadow);
    }
    header h1{font-size:1.3rem;font-weight:700}
    .toggle-theme{
      position:absolute;
      top:.6rem;
      right:.8rem;
      background:none;
      border:none;
      font-size:1.2rem;
      cursor:pointer;
      color:var(--sea-dark);
    }
    .container{max-width:1200px;margin:0 auto;padding:.5rem}
    .glass-card{
      background:var(--glass);
      border:1px solid var(--glass-border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:1rem;
      margin-bottom:.75rem;
      backdrop-filter:blur(12px);
      transition:transform .3s;
    }
    .glass-card:hover{transform:translateY(-2px)}
    label{font-size:.8rem;font-weight:600;margin:.3rem 0 .1rem;display:block}
    input,textarea,select{
      width:100%;
      padding:.6rem;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,.7);
      transition:background .3s;
      font-size:.9rem;
    }
    [data-theme="dark"] input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] select{
      background:rgba(255,255,255,.1);
      color:#fff;
    }
    .btn-group{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
    .btn{
      flex:1 1 150px;
      padding:.7rem 1rem;
      border:none;
      border-radius:25px;
      font-weight:700;
      cursor:pointer;
      font-size:.85rem;
      transition:transform .2s,box-shadow .3s;
    }
    .btn:active{transform:scale(.96)}
    .btn-primary{background:var(--sea);color:#fff;box-shadow:0 4px 14px rgba(0,136,255,.45)}
    .btn-danger{background:var(--coral);color:#fff}
    #map{height:60vh;border-radius:var(--radius);box-shadow:var(--shadow)}
    .vehicle-options{display:flex;gap:.6rem;justify-content:center;margin:.6rem 0}
    .vehicle-card{
      flex:1 1 90px;
      text-align:center;
      padding:.6rem;
      border-radius:var(--radius);
      border:2px solid transparent;
      cursor:pointer;
      transition:border .3s,transform .2s;
    }
    .vehicle-card.selected{
      border-color:var(--sea);
      background:rgba(0,136,255,.15);
      transform:scale(1.05)
    }
    .vehicle-card i{font-size:1.8rem;margin-bottom:.3rem;color:var(--sea)}
    .vehicle-card input{display:none}
    /* shimmer skeleton */
    .shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
    .driver-card{background:var(--glass);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .3s}
    .driver-card:hover{transform:scale(1.03)}
    .driver-card img{width:100%;height:110px;object-fit:cover}
    .driver-info{padding:.6rem;font-size:.8rem}
    .driver-info .name{font-weight:700;font-size:.9rem}
    .driver-info .rating{color:var(--coral);margin:.2rem 0}
    .driver-info .plate{background:rgba(255,255,255,.3);border-radius:8px;padding:.2rem .4rem;font-weight:600}
    /* bottom sheet */
    .bottom-sheet{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      z-index:1001;
      background:var(--glass);
      backdrop-filter:blur(15px);
      border-top:1px solid var(--glass-border);
      border-radius:var(--radius) var(--radius) 0 0;
      padding:1rem;
      transform:translateY(100%);
      transition:transform .4s;
      box-shadow:var(--shadow);
    }
    .bottom-sheet.show{transform:translateY(0)}
    .bottom-sheet h3{font-size:1rem;margin-bottom:.5rem}
    .bottom-sheet p{margin:.2rem 0;font-size:.8rem}
    .passenger-select{display:flex;gap:.4rem;margin:.3rem 0}
    .passenger-select label{
      flex:1;text-align:center;
      padding:.4rem;
      border:1px solid var(--glass-border);
      border-radius:12px;
      cursor:pointer;
    }
    .passenger-select input{display:none}
    .passenger-select input:checked+span{background:var(--sea);color:#fff}
    /* responsive */
    @media(min-width:600px){
      header h1{font-size:1.6rem}
      .btn-group{justify-content:flex-start}
    }
  </style>
</head>
<body>
<header>
  <h1><i class="fa-solid fa-motorcycle"></i> NOS Premium – Ojek Online Jawa Timur</h1>
  <p style="font-size:.75rem;margin-top:.2rem">Klik dua titik atau cari tempat → pilih driver → WhatsApp</p>
  <button class="toggle-theme" id="toggleTheme" title="Ganti tema"><i class="fa-solid fa-circle-half-stroke"></i></button>
</header>

<div class="container">
  <!-- peta -->
  <div class="glass-card">
    <label><i class="fa-solid fa-map-location-dot"></i> Pilih Lokasi / Cari Tempat</label>
    <div id="map"></div>
  </div>

  <!-- form -->
  <div class="glass-card">
    <label>Penjemputan</label>
    <input id="pickup" readonly placeholder="Belum dipilih"/>
    <label>Tujuan</label>
    <input id="destination" readonly placeholder="Belum dipilih"/>
    <label>Jarak via jalan</label>
    <input id="distance" readonly placeholder="0 km"/>
    <label id="fareLabel">Estimasi Tarif</label>
    <input id="fare" readonly placeholder="Rp 0"/>
  </div>

  <!-- kendaraan -->
  <div class="glass-card">
    <label><i class="fa-solid fa-truck-pickup"></i> Pilih Kendaraan</label>
    <div class="vehicle-options">
      <label class="vehicle-card">
        <input type="radio" name="vehicle" value="motor" checked onchange="updateFare()"/>
        <i class="fa-solid fa-motorcycle"></i><br>Motor
      </label>
      <label class="vehicle-card">
        <input type="radio" name="vehicle" value="mobil" onchange="updateFare()"/>
        <i class="fa-solid fa-car-side"></i><br>Mobil
      </label>
    </div>
    <label>Jumlah Penumpang</label>
    <div class="passenger-select">
      <label>
        <input type="radio" name="passengers" value="1" checked onchange="updateFare()"/>
        <span>1 Orang</span>
      </label>
      <label>
        <input type="radio" name="passengers" value="2" onchange="updateFare()"/>
        <span>2 Orang</span>
      </label>
    </div>
  </div>

  <!-- data penumpang -->
  <div class="glass-card">
    <label><i class="fa-solid fa-user-check"></i> Data Penumpang</label>
    <input id="nama" placeholder="Nama lengkap"/>
    <input id="wa" placeholder="08 / 62" type="tel" maxlength="13" pattern="\d*"/>
    <textarea id="catatan" rows="2" placeholder="Catatan (maks 300)" maxlength="300"></textarea>
    <div id="charCount" style="font-size:.7rem;text-align:right">0 / 300</div>
  </div>

  <!-- CTA -->
  <div class="btn-group">
    <button class="btn btn-primary" onclick="getCurrentLocation()">
      <i class="fa-solid fa-location-crosshairs"></i> Lokasi Saya
    </button>
    <button class="btn btn-primary" onclick="nextStep()">
      <i class="fa-brands fa-whatsapp"></i> Lanjut Pilih Driver
    </button>
    <button class="btn btn-danger" onclick="resetMap()">
      <i class="fa-solid fa-rotate-left"></i> Reset
    </button>
  </div>
</div>

<!-- shimmer skeleton -->
<div id="shimmerCard" class="glass-card" style="display:none">
  <label><i class="fa-solid fa-id-card"></i> Memuat Driver…</label>
  <div class="driver-grid">
    <div class="driver-card shimmer"><div style="height:110px"></div></div>
    <div class="driver-card shimmer"><div style="height:110px"></div></div>
  </div>
</div>

<!-- daftar driver -->
<div id="driversCard" class="glass-card" style="display:none">
  <label><i class="fa-solid fa-id-card"></i> Pilih Driver</label>
  <div id="drivers" class="driver-grid"></div>
</div>

<!-- bottom sheet ringkasan -->
<div id="summarySheet" class="bottom-sheet">
  <h3><i class="fa-solid fa-clipboard-check"></i> Ringkasan Pesanan</h3>
  <p><strong>Nama:</strong> <span id="sumNama"></span></p>
  <p><strong>Kendaraan:</strong> <span id="sumVehicle"></span></p>
  <p><strong>Penumpang:</strong> <span id="sumPassengers"></span></p>
  <p><strong>Jarak:</strong> <span id="sumDistance"></span></p>
  <p><strong>Estimasi:</strong> <span id="sumFare"></span></p>
  <p><strong>Catatan:</strong> <span id="sumCatatan"></span></p>
  <button class="btn btn-primary" id="btnChat" style="width:100%">
    <i class="fa-brands fa-whatsapp"></i> Kirim ke WhatsApp
  </button>
</div>

<!-- Leaflet & Plugins -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1500;
  const TARIF_MOBIL = 3000;
  const bounds = [[-8.8,111.8],[-6.8,115.8]];
  const map = L.map('map',{center:[-7.5,113],zoom:11,minZoom:9,maxZoom:19,maxBounds:bounds});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',
    maxNativeZoom:19
  }).addTo(map);

  /* Geocoder & Locate */
  L.Control.geocoder({
    collapsed:false,
    placeholder:'Cari jalan/gang/pasar/dusun/desa…',
    geocoder: L.Control.Geocoder.nominatim({
      geocodingQueryParams: {
        countrycodes: 'id',
        viewbox: '111.8,-8.8,115.8,-6.8',
        bounded: 1
      }
    })
  }).addTo(map);
  L.control.locate({position:'topright',strings:{title:'Lokasi saya'}}).addTo(map);

  /* Theme toggle */
  const html=document.documentElement;
  const toggleBtn=document.getElementById('toggleTheme');
  toggleBtn.onclick=()=>{
    html.dataset.theme=html.dataset.theme==='dark'?'':'dark';
    localStorage.setItem('theme',html.dataset.theme);
  };
  (()=>{
    const saved=localStorage.getItem('theme');
    if(saved==='dark') html.dataset.theme='dark';
    else html.dataset.theme='';
  })();

  /* State */
  let A,B,routeLine,distanceKm=0;
  const driverList=[
    {name:"Budi Santoso",wa:"6285647709114",img:"1",plat:"S 1234 JI",rating:4.9},
    {name:"Ani Wijaya",wa:"6285647709115",img:"2",plat:"N 5678 AT",rating:4.8},
    {name:"Rizky Pratama",wa:"6285647709116",img:"3",plat:"L 9012 TM",rating:4.7}
  ];

  /* Char counter */
  document.getElementById('catatan').addEventListener('input',e=>{
    document.getElementById('charCount').textContent=e.target.value.length+' / 300';
  });

  /* Klik titik */
  map.on('click',async e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Penjemputan').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Tujuan').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      await hitungRute();
    }
  });

  async function hitungRute(){
    if(!A || !B) return;
    const [lat1,lng1]=[A.getLatLng().lat,A.getLatLng().lng];
    const [lat2,lng2]=[B.getLatLng().lat,B.getLatLng().lng];
    const url=`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
    try{
      const res=await fetch(url);
      const data=await res.json();
      if(data.routes && data.routes[0]){
        const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distanceKm=(data.routes[0].distance/1000).toFixed(2);
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline(coords,{color:'#0088ff',weight:6}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        updateFare();
        playNotify();
      }
    }catch{alert('Gagal menghitung rute. Coba lagi.');}
  }

  function playNotify(){
    const audio=new Audio('data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ4AAAA=');
    audio.play().catch(()=>{});
  }

  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const passengers=parseInt(document.querySelector('input[name="passengers"]:checked').value);
    const tarif=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarif*passengers);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  function getCurrentLocation(){
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude,longitude}=pos.coords;
      map.setView([latitude,longitude],15);
      if(A){map.removeLayer(A);A=null;}
      A=L.marker([latitude,longitude]).addTo(map).bindPopup('Lokasi Saya').openPopup();
      document.getElementById('pickup').value=`${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    });
  }

  function resetMap(){
    [A,B,routeLine].forEach(l=>l&&map.removeLayer(l));
    A=B=routeLine=null;
    ['pickup','destination','distance','fare','nama','wa','catatan'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('charCount').textContent='0 / 300';
    document.getElementById('shimmerCard').style.display='none';
    document.getElementById('driversCard').style.display='none';
    document.getElementById('summarySheet').classList.remove('show');
  }

  function validateWA(num){
    return /^(08|62)\d{8,11}$/.test(num.trim());
  }

  async function nextStep(){
    if(!A || !B){alert('Pilih Penjemputan & Tujuan');return;}
    if(!document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    const wa=document.getElementById('wa').value.trim();
    if(!validateWA(wa)){alert('Nomor WhatsApp harus 08/62 + 8-11 digit angka');return;}
    
    document.getElementById('shimmerCard').style.display='block';
    document.getElementById('driversCard').style.display='none';
    await new Promise(r=>setTimeout(r,800));
    
    document.getElementById('shimmerCard').style.display='none';
    renderDrivers();
    document.getElementById('driversCard').style.display='block';
  }

  function renderDrivers(){
    const container=document.getElementById('drivers');
    container.innerHTML='';
    driverList.forEach(d=>{
      const div=document.createElement('div');
      div.className='driver-card';
      div.innerHTML=`
        <img src="https://i.pravatar.cc/200?img=${d.img}" alt="${d.name}">
        <div class="driver-info">
          <div class="name">${d.name}</div>
          <div class="rating">
            <i class="fa-solid fa-star"></i> ${d.rating}
          </div>
          <div class="plate">${d.plat}</div>
          <button class="btn btn-primary" onclick="selectDriver('${d.wa}','${d.name}')">Pilih Driver</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function selectDriver(no,nama){
    const namaPen=document.getElementById('nama').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const passengers=document.querySelector('input[name="passengers"]:checked').value;
    const catatan=document.getElementById('catatan').value;
    const fare=document.getElementById('fare').value;

    document.getElementById('sumNama').textContent=namaPen;
    document.getElementById('sumVehicle').textContent=vehicle==='motor'?'Motor':'Mobil';
    document.getElementById('sumPassengers').textContent=passengers+' orang';
    document.getElementById('sumDistance').textContent=`${distanceKm} km`;
    document.getElementById('sumFare').textContent=fare;
    document.getElementById('sumCatatan').textContent=catatan || '-';

    document.getElementById('driversCard').style.display='none';
    document.getElementById('summarySheet').classList.add('show');

    const text=`Halo ${nama}, saya ${namaPen}\nIngin pesan ojek NOS:\nKendaraan: ${vehicle}\nPenumpang: ${passengers} orang\nJarak: ${distanceKm} km\nEstimasi: ${fare}\nCatatan: ${catatan}`;
    document.getElementById('btnChat').onclick=()=>window.open(`https://wa.me/${no}?text=${encodeURIComponent(text)}`);
  }

  /* shortcuts */
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey && e.key==='/') resetMap();
    if(e.ctrlKey && e.key==='Enter') nextStep();
  });
</script>
</body>
</html>
