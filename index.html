<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS – Ojek Online Jatim (Premium)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <!-- CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --sea:#0099cc;
      --sand:#fef7e6;
      --coral:#ff6b35;
      --dark:#121212;
      --darkCard:#1e1e1e;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:var(--sand);color:#222;transition:background .3s}
    body.dark{background:var(--dark);color:#eee}
    header{background:var(--sea);color:#fff;padding:1.5rem;text-align:center;position:relative}
    header h1{font-size:2.2rem}
    .theme-toggle{position:absolute;top:1.2rem;right:1.2rem;font-size:1.5rem;cursor:pointer}
    .container{max-width:1100px;margin:0 auto;padding:1rem}
    .card{background:#fff;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    body.dark .card{background:var(--darkCard)}
    label{display:block;margin:.5rem 0 .2rem;font-weight:600}
    input,textarea{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:10px;font-size:1rem;background:transparent}
    body.dark input,body.dark textarea{border-color:#555;color:#eee}
    .btn-group{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap}
    .btn{flex:1 1 180px;padding:.9rem;border:none;border-radius:50px;font-weight:700;cursor:pointer;transition:.3s}
    .btn-primary{background:var(--sea);color:#fff}
    .btn-danger{background:var(--coral);color:#fff}
    #map{height:65vh;border-radius:16px}
    .loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffffee;display:flex;align-items:center;justify-content:center;z-index:9999}
    body.dark .loader{background:#121212ee}
    .loader .spinner{width:60px;height:60px;border:6px solid #eee;border-top-color:var(--sea);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Pilihan kendaraan premium */
    .vehicle-options{display:flex;gap:1rem;flex-wrap:wrap}
    .vehicle-card{flex:1 1 150px;position:relative;border:2px solid transparent;border-radius:14px;padding:1rem;text-align:center;cursor:pointer;transition:.3s}
    .vehicle-card.selected{border-color:var(--sea);background:#e6f7ff}
    body.dark .vehicle-card.selected{background:#0c2e42}
    .vehicle-card i{font-size:2.2rem;margin-bottom:.5rem}
    .vehicle-card .label{font-weight:700}
    .vehicle-card input{display:none}

    /* Driver card premium */
    .driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .driver-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:.3s}
    body.dark .driver-card{background:var(--darkCard)}
    .driver-card img{width:100%;height:140px;object-fit:cover}
    .driver-info{padding:.75rem}
    .driver-info .name{font-weight:700;font-size:1.1rem}
    .driver-info .rating{color:var(--coral)}
    .driver-info .plate{background:#eee;border-radius:8px;padding:.2rem .5rem;font-size:.8rem;color:#333;margin:.3rem 0}
    body.dark .driver-info .plate{background:#333;color:#eee}
  </style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div></div>

<header>
  <h1>NOS – Ojek Online Jawa Timur (Premium)</h1>
  <p>Klik dua titik di peta → pilih driver → order via WhatsApp</p>
  <div class="theme-toggle" onclick="toggleTheme()" title="Mode Gelap/Terang">
    <i id="theme-icon" class="fa-solid fa-moon"></i>
  </div>
</header>

<div class="container">
  <!-- === CARD 1: MAP & DATA === -->
  <div class="card">
    <h2><i class="fa-solid fa-map-pin"></i> 1. Pilih Lokasi</h2>
    <div id="map"></div>
    <label>Penjemputan</label>
    <input id="pickup" readonly/>
    <label>Tujuan</label>
    <input id="destination" readonly/>
    <label>Jarak via jalan</label>
    <input id="distance" readonly/>
    <label>Perkiraan tarif</label>
    <input id="fare" readonly/>

    <h3><i class="fa-solid fa-motorcycle"></i> Kendaraan</h3>
    <div class="vehicle-options">
      <label class="vehicle-card">
        <input type="radio" name="vehicle" value="motor" checked/>
        <i class="fa-solid fa-motorcycle"></i>
        <div class="label">Motor</div>
      </label>
      <label class="vehicle-card">
        <input type="radio" name="vehicle" value="mobil"/>
        <i class="fa-solid fa-car-side"></i>
        <div class="label">Mobil</div>
      </label>
    </div>

    <h3><i class="fa-solid fa-user"></i> Data Penumpang</h3>
    <input id="nama" placeholder="Nama lengkap"/>
    <input id="wa" placeholder="Nomor WhatsApp" type="tel"/>
    <textarea id="catatan" rows="2" placeholder="Catatan (opsional)"></textarea>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="getCurrentLocation()">
        <i class="fa-solid fa-location-crosshairs"></i> Lokasi Saya
      </button>
      <button class="btn btn-primary" onclick="nextStep()">
        <i class="fa-brands fa-whatsapp"></i> Pilih Driver & Order
      </button>
      <button class="btn btn-danger" onclick="resetMap()">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <!-- === CARD 2: DAFTAR DRIVER === -->
  <div id="driversCard" class="card" style="display:none">
    <h3><i class="fa-solid fa-id-card"></i> Pilih Driver</h3>
    <div class="driver-grid" id="drivers"></div>
  </div>

  <!-- === CARD 3: RINGKASAN ORDER === -->
  <div id="summaryCard" class="card" style="display:none">
    <h3><i class="fa-solid fa-clipboard-check"></i> Ringkasan Pesanan</h3>
    <p><strong>Nama:</strong> <span id="sumNama"></span></p>
    <p><strong>Kendaraan:</strong> <span id="sumVehicle"></span></p>
    <p><strong>Jarak:</strong> <span id="sumDistance"></span></p>
    <p><strong>Estimasi Tarif:</strong> <span id="sumFare"></span></p>
    <p><strong>Catatan:</strong> <span id="sumCatatan"></span></p>
    <button class="btn btn-primary" id="btnChat"><i class="fa-brands fa-whatsapp"></i> Kirim ke WhatsApp</button>
  </div>
</div>

<!-- === SCRIPT === -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1200;
  const TARIF_MOBIL = 3000;
  const bounds = [[-8.8,111.8],[-6.8,115.8]];
  const map = L.map('map',{center:[-7.5,113],zoom:8,minZoom:7,maxZoom:18,maxBounds:bounds});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);

  let A, B, routeLine, distanceKm = 0;

  /* === DRIVER DATA (dummy) === */
  const driverList = [
    {name:"Budi Santoso", wa:"6285647709114", img:"1", plat:"S 1234 JI", rating:4.9},
    {name:"Ani Wijaya", wa:"6285647709115", img:"2", plat:"N 5678 AT", rating:4.8},
    {name:"Rizky Pratama", wa:"6285647709116", img:"3", plat:"L 9012 TM", rating:4.7}
  ];

  /* === THEME === */
  function toggleTheme(){
    document.body.classList.toggle('dark');
    const icon = document.getElementById('theme-icon');
    icon.className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }

  /* === MAP CLICK === */
  map.on('click',async e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Penjemputan').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Tujuan').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      await hitungRute();
    }
  });

  async function hitungRute(){
    if(!A || !B) return;
    const [lat1,lng1]=[A.getLatLng().lat,A.getLatLng().lng];
    const [lat2,lng2]=[B.getLatLng().lat,B.getLatLng().lng];
    const url=`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
    try{
      const res=await fetch(url);
      const data=await res.json();
      if(data.routes && data.routes[0]){
        const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distanceKm=(data.routes[0].distance/1000).toFixed(2);
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline(coords,{color:'var(--sea)',weight:6}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        updateFare();
      }
    }catch{alert('Gagal menghitung rute. Coba lagi.');}
  }

  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const tarifPerKm=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarifPerKm);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  /* === GPS === */
  function getCurrentLocation(){
    if(!navigator.geolocation){alert('GPS tidak tersedia');return;}
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude,longitude}=pos.coords;
      map.setView([latitude,longitude],14);
      if(A){map.removeLayer(A);A=null;}
      A=L.marker([latitude,longitude]).addTo(map).bindPopup('Lokasi Saya').openPopup();
      document.getElementById('pickup').value=`${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    });
  }

  /* === RESET === */
  function resetMap(){
    [A,B,routeLine].forEach(l=>l&&map.removeLayer(l));
    A=B=routeLine=null;
    ['pickup','destination','distance','fare'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('driversCard').style.display='none';
    document.getElementById('summaryCard').style.display='none';
  }

  /* === PILIH DRIVER === */
  function nextStep(){
    if(!A || !B){alert('Pilih Penjemputan & Tujuan terlebih dahulu');return;}
    if(!document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    if(!document.getElementById('wa').value.trim()){alert('Isi nomor WhatsApp');return;}
    renderDrivers();
    document.getElementById('driversCard').style.display='block';
  }

  function renderDrivers(){
    const container=document.getElementById('drivers');
    container.innerHTML='';
    driverList.forEach(d=>{
      const div=document.createElement('div');
      div.className='driver-card';
      div.innerHTML=`
        <img src="https://i.pravatar.cc/150?img=${d.img}" alt="${d.name}">
        <div class="driver-info">
          <div class="name">${d.name}</div>
          <div class="rating">
            <i class="fa-solid fa-star"></i> ${d.rating}
          </div>
          <div class="plate">${d.plat}</div>
          <button class="btn btn-primary" onclick="summary('${d.wa}','${d.name}')">Pilih & Pesan</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  /* === RINGKASAN === */
  function summary(no,nama){
    const namaPen=document.getElementById('nama').value;
    const waPen=document.getElementById('wa').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const catatan=document.getElementById('catatan').value;
    const fare=document.getElementById('fare').value;

    document.getElementById('sumNama').textContent=namaPen;
    document.getElementById('sumVehicle').textContent=vehicle==='motor'?'Motor':'Mobil';
    document.getElementById('sumDistance').textContent=`${distanceKm} km`;
    document.getElementById('sumFare').textContent=fare;
    document.getElementById('sumCatatan').textContent=catatan || '-';

    document.getElementById('driversCard').style.display='none';
    document.getElementById('summaryCard').style.display='block';

    const text=`Halo ${nama}, saya ${namaPen} (${waPen})\n\nIngin pesan ojek NOS:\nKendaraan: ${vehicle}\nJarak: ${distanceKm} km\nEstimasi: ${fare}\nCatatan: ${catatan}`;
    document.getElementById('btnChat').onclick=()=>window.open(`https://wa.me/${no}?text=${encodeURIComponent(text)}`);
  }

  /* === LOAD === */
  window.onload=()=>document.getElementById('loader').style.display='none';
</script>
</body>
</html>
