<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>NOS Situbondo – Hitung Jarak & Pilih Driver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      --primary:#1a365d;
      --accent:#e67e22;
      --danger:#e53e3e;
      --light:#f8f9fa;
      --text:#4a5568;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
    body{background:var(--light);color:var(--text);line-height:1.6}
    .container{max-width:900px;margin:0 auto;padding:1rem}
    header{text-align:center;margin-bottom:1rem}
    header h2{color:var(--primary)}
    .form{background:#fff;padding:1rem;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:1rem}
    label{display:block;margin:.5rem 0 .2rem;font-weight:600}
    input{width:100%;padding:.7rem;border:1px solid #ccc;border-radius:6px;font-size:1rem}
    .btn-merah{background:var(--danger);color:#fff;border:none;padding:.6rem 1rem;border-radius:6px;cursor:pointer;margin:.5rem .5rem 0 0}
    .btn-merah:hover{transform:translateY(-2px)}
    #map{height:70vh;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
    .driver-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;margin-top:1rem}
    .driver-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem;text-align:center}
    .driver-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:.5rem}
    .driver-name{font-weight:600}
    .driver-wa{font-size:.85rem;color:var(--primary);cursor:pointer}
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h2>Pilih Titik & Pilih Driver – Kota Situbondo</h2>
    </header>

    <div class="form">
      <label>Pickup (Titik A)</label>
      <input id="pickup" readonly>
      <label>Destination (Titik B)</label>
      <input id="destination" readonly>
      <p id="distance">Jarak: – km</p>
      <p id="fare">Tarif: Rp –</p>
      <button class="btn-merah" onclick="resetTitik()">Reset Titik</button>
    </div>

    <div id="map"></div>

    <h3 style="margin:2rem 0 1rem;">Driver yang Tersedia</h3>
    <div class="driver-list" id="driverList"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* 1. Peta hanya wilayah Situbondo */
    const bounds = [[-7.74, 113.98], [-7.68, 114.04]];
    const map = L.map('map', {center:[-7.7058,114.0094], zoom:14, maxBounds:bounds, minZoom:13, maxZoom:18})
                 .addLayer(L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'));

    let markerA, markerB, line, distanceKm = 0;
    const TARIF_PER_KM = 12000;

    /* 2. Klik untuk memilih titik */
    map.on('click', function (e) {
      const {lat, lng} = e.latlng;
      if (!markerA) {
        markerA = L.marker([lat, lng]).addTo(map).bindPopup('Titik A').openPopup();
        document.getElementById('pickup').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      } else if (!markerB) {
        markerB = L.marker([lat, lng]).addTo(map).bindPopup('Titik B').openPopup();
        document.getElementById('destination').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        line = L.polyline([markerA.getLatLng(), markerB.getLatLng()], {color:'red', weight:4}).addTo(map);
        distanceKm = map.distance(markerA.getLatLng(), markerB.getLatLng()) / 1000;
        const fare = (distanceKm * TARIF_PER_KM).toLocaleString('id-ID');
        document.getElementById('distance').textContent = `Jarak: ${distanceKm.toFixed(2)} km`;
        document.getElementById('fare').textContent = `Tarif: Rp ${fare}`;
      }
    });

    /* 3. Reset titik */
    function resetTitik() {
      [markerA, markerB, line].forEach(m => m && map.removeLayer(m));
      markerA = markerB = line = null;
      document.getElementById('pickup').value = '';
      document.getElementById('destination').value = '';
      document.getElementById('distance').textContent = 'Jarak: – km';
      document.getElementById('fare').textContent = 'Tarif: Rp –';
    }

    /* 4. Daftar driver + WhatsApp */
    const drivers = [
      {name:"Budi Santoso", phone:"6285647709114", img:"https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver1.jpeg?raw=true"},
      {name:"Ani Wijaya", phone:"6285647709114", img:"https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver2.jpeg?raw=true"},
      {name:"Ahmad Firdaus", phone:"6285647709114", img:"https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver4.jpeg?raw=true"}
    ];
    const driverList = document.getElementById('driverList');
    drivers.forEach(d => {
      const card = document.createElement('div');
      card.className = 'driver-card';
      card.innerHTML = `
        <img src="${d.img}" alt="${d.name}" class="driver-avatar">
        <div class="driver-name">${d.name}</div>
        <div class="driver-wa" onclick="window.open('https://wa.me/${d.phone}?text=Pesan%20ojek%20NOS%20sekarang.%20Jarak%20${distanceKm.toFixed(2)}%20km%20-%20Rp%20${(distanceKm*TARIF_PER_KM).toLocaleString('id-ID')}')">
          Chat WhatsApp
        </div>
      `;
      driverList.appendChild(card);
    });
  </script>
</body>
</html>
