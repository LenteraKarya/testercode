<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>NOS – Nompak Ojek Situbondo (Super-Final)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --primary:#0f172a;
      --accent:#f97316;
      --success:#10b981;
      --danger:#ef4444;
      --light:#f8fafc;
      --gray:#64748b;
      --bg:#e2e8f0;
      --shadow:0 4px 12px rgba(0,0,0,.15);
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:var(--bg);color:var(--primary)}
    .container{max-width:960px;margin:0 auto;padding:1rem}
    header{background:linear-gradient(135deg,#0f172a,#334155);color:#fff;padding:2rem 1rem;text-align:center}
    header h1{font-size:2.2rem;font-weight:700;letter-spacing:.5px}
    header p{opacity:.8;margin-top:.25rem}
    .progress{display:flex;justify-content:center;margin:1.5rem 0;gap:.5rem}
    .progress span{
      width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:#cbd5e1;color:var(--primary);font-weight:700;font-size:1.1rem;transition:.3s
    }
    .progress span.active{background:var(--accent);color:#fff}
    .step{display:none;animation:fadeIn .4s}
    .step.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:1.5rem}
    label{display:block;margin:.75rem 0 .25rem;font-weight:600;font-size:.9rem}
    input,select,textarea{width:100%;padding:.8rem;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}
    input[readonly]{background:#f1f5f9}
    .btn-group{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
    .btn{
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.8rem 1.8rem;background:var(--accent);color:#fff;border:none;border-radius:50px;
      font-weight:600;cursor:pointer;transition:.3s;box-shadow:var(--shadow)
    }
    .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
    .btn-success{background:var(--success)}
    .btn-danger{background:var(--danger)}
    #map{height:65vh;border-radius:16px}
    .drivers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem}
    .driver{
      background:#fff;border-radius:14px;overflow:hidden;text-align:center;
      box-shadow:var(--shadow);transition:.3s
    }
    .driver:hover{transform:translateY(-4px)}
    .driver img{width:100%;height:130px;object-fit:cover}
    .driver .name{font-weight:700;padding:.7rem;font-size:1rem}
    .loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:.5rem}
    .loader .spinner{width:50px;height:50px;border:5px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<!-- Loading -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p style="color:var(--accent)">Memuat peta...</p>
</div>

<header>
  <h1>NOS – Nompak Ojek Situbondo</h1>
  <p>Klik dua titik di peta → otomatis hitung rute via jalan raya</p>
</header>

<div class="container">
  <!-- Progress -->
  <div class="progress">
    <span class="active" id="p1">1</span>
    <span id="p2">2</span>
    <span id="p3">3</span>
    <span id="p4">4</span>
  </div>

  <!-- Step 1 -->
  <div class="step active" id="step1">
    <div class="card">
      <h2><i class="fa-solid fa-location-dot"></i> 1. Pilih Lokasi</h2>
      <div id="map"></div>
      <label>Penjemputan</label>
      <input id="pickup" readonly/>
      <label>Tujuan</label>
      <input id="destination" readonly/>
      <label>Jarak via jalan raya</label>
      <input id="distance" readonly/>
      <label>Perkiraan tarif</label>
      <input id="fare" readonly/>
      <div class="btn-group">
        <button class="btn" onclick="next(2)"><i class="fa-solid fa-arrow-right"></i> Lanjut</button>
        <button class="btn-danger" onclick="resetAll()"><i class="fa-solid fa-rotate-left"></i> Reset Lokasi</button>
      </div>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="step" id="step2">
    <div class="card">
      <h2><i class="fa-solid fa-motorcycle"></i> 2. Pilih Kendaraan</h2>
      <label><input type="radio" name="vehicle" value="motor" checked/> Motor – Rp 1.200/km</label>
      <label><input type="radio" name="vehicle" value="mobil"/> Mobil – Rp 3.000/km</label>
      <div class="btn-group">
        <button class="btn" onclick="next(3)"><i class="fa-solid fa-arrow-right"></i> Lanjut</button>
        <button class="btn-danger" onclick="next(1)"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
      </div>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="step" id="step3">
    <div class="card">
      <h2><i class="fa-solid fa-user"></i> 3. Data Penumpang</h2>
      <label>Nama Lengkap</label>
      <input id="nama" placeholder="Contoh: Siti Nurhaliza"/>
      <label>Nomor WhatsApp</label>
      <input id="wa" placeholder="0812xxxx" type="tel"/>
      <label>Catatan (opsional)</label>
      <textarea id="catatan" rows="2" placeholder="Contoh: pakai helm double"></textarea>
      <div class="btn-group">
        <button class="btn" onclick="next(4)"><i class="fa-solid fa-arrow-right"></i> Lihat Driver</button>
        <button class="btn-danger" onclick="next(2)"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
      </div>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="step" id="step4">
    <div class="card">
      <h2><i class="fa-solid fa-id-card"></i> 4. Pilih Driver</h2>
      <div class="drivers" id="drivers"></div>
      <button class="btn-danger" onclick="next(3)"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* === CONFIG === */
  const TARIF_MOTOR = 1200;
  const TARIF_MOBIL = 3000;
  // Batas wilayah Situbondo diperluas agar bisa di-zoom lebih jauh
  const bounds = [[-7.80,113.90],[-7.60,114.10]];
  const drivers = [
    {name:'Budi Santoso',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver1.jpeg?raw=true'},
    {name:'Ani Wijaya',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver2.jpeg?raw=true'},
    {name:'Ahmad Firdaus',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver4.jpeg?raw=true'},
    {name:'Darmawan Setiawan',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver5.jpeg?raw=true'},
    {name:'Siti Rahmawati',phone:'6285647709114',img:'https://github.com/LenteraKarya/NOS/blob/main/assets/images/driver6.jpeg?raw=true'}
  ];

  /* === MAP === */
  const map = L.map('map',{center:[-7.7058,114.0094],zoom:13,minZoom:12,maxZoom:18,maxBounds:bounds});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  let A,B,routeLine,routeControl,distanceKm=0;

  /* Click Penjemputan & Tujuan */
  map.on('click',async e=>{
    const {lat,lng}=e.latlng;
    if(!A){
      A=L.marker([lat,lng]).addTo(map).bindPopup('Penjemputan').openPopup();
      document.getElementById('pickup').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }else if(!B){
      B=L.marker([lat,lng]).addTo(map).bindPopup('Tujuan').openPopup();
      document.getElementById('destination').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      await hitungRute();
    }
  });

  /* === Hitung rute via jalan raya (OSRM) === */
  async function hitungRute(){
    if(!A || !B) return;
    const [lat1,lng1]=[A.getLatLng().lat,A.getLatLng().lng];
    const [lat2,lng2]=[B.getLatLng().lat,B.getLatLng().lng];
    const url=`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;

    try{
      const res=await fetch(url);
      const data=await res.json();
      if(data.routes && data.routes[0]){
        const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distanceKm=(data.routes[0].distance/1000).toFixed(2);
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline(coords,{color:'#f97316',weight:5}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        updateFare();
      }
    }catch(err){
      alert('Gagal menghitung rute. Coba lagi.');
    }
  }

  function updateFare(){
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const tarifPerKm=vehicle==='motor'?TARIF_MOTOR:TARIF_MOBIL;
    const total=Math.round(distanceKm*tarifPerKm);
    document.getElementById('distance').value=`${distanceKm} km`;
    document.getElementById('fare').value=`Rp ${total.toLocaleString('id-ID')}`;
  }

  function resetAll(){
    [A,B,routeLine].forEach(l=>l&&map.removeLayer(l));
    A=B=routeLine=null;
    ['pickup','destination','distance','fare'].forEach(id=>document.getElementById(id).value='');
  }

  /* === NAVIGASI STEP === */
  function next(n){
    if(n===2 && (!A || !B)){alert('Pilih Penjemputan & Tujuan terlebih dahulu');return;}
    if(n===4 && !document.getElementById('nama').value.trim()){alert('Isi nama lengkap');return;}
    if(n===4 && !document.getElementById('wa').value.trim()){alert('Isi nomor WhatsApp');return;}

    document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.progress span').forEach((el,i)=>el.classList.toggle('active',i<n));
    document.getElementById('step'+n).classList.add('active');

    if(n===4) renderDrivers();
  }

  /* === RENDER DRIVER === */
  function renderDrivers(){
    const nama=document.getElementById('nama').value;
    const wa=document.getElementById('wa').value;
    const catatan=document.getElementById('catatan').value;
    const total=document.getElementById('fare').value;
    const vehicle=document.querySelector('input[name="vehicle"]:checked').value;
    const txt=`Halo, saya ${nama} (${wa})\n\nIngin pesan ojek NOS\nKendaraan: ${vehicle}\nJarak: ${distanceKm} km\nTotal: ${total}\nCatatan: ${catatan}`;

    const box=document.getElementById('drivers');
    box.innerHTML='';
    drivers.forEach(d=>{
      const div=document.createElement('div');
      div.className='driver';
      div.innerHTML=`
        <img src="${d.img}" alt="${d.name}">
        <div class="name">${d.name}</div>
        <button class="btn" onclick="window.open('https://wa.me/${d.phone}?text=${encodeURIComponent(txt)}')">
          <i class="fa-brands fa-whatsapp"></i> Pilih Driver
        </button>
      `;
      box.appendChild(div);
    });
  }

  window.onload=()=>document.getElementById('loader').style.display='none';
</script>
</body>
</html>
