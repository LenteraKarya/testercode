<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOS - Nompak Ojek Situbondo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B00;
            --secondary: #FFA726;
            --dark: #333;
            --light: #f9f9f9;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --info: #3498db;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
        body{background:#f5f5f5;color:var(--dark);line-height:1.6;}
        .container{max-width:800px;margin:0 auto;padding:20px;}
        header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:20px 0;text-align:center;border-radius:0 0 20px 20px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:30px;}
        .logo{display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
        .logo i{font-size:2.5rem;margin-right:15px;}
        .logo-text h1{font-size:2rem;font-weight:700;}
        .logo-text p{font-size:.9rem;opacity:.9;}
        .card{background:#fff;border-radius:15px;padding:25px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:30px;}
        .card-title{font-size:1.5rem;margin-bottom:20px;color:var(--primary);font-weight:600;display:flex;align-items:center;}
        .card-title i{margin-right:10px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;font-weight:500;}
        input,select,textarea{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:8px;font-size:1rem;transition:all .3s;}
        input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(255,107,0,.2);}
        .btn{display:inline-block;background:var(--primary);color:#fff;border:none;padding:12px 25px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:500;transition:all .3s;text-transform:uppercase;letter-spacing:1px;}
        .btn:hover{background:#e05a00;transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.1);}
        .btn-block{display:block;width:100%;}
        .price-display{background:var(--light);padding:20px;border-radius:10px;margin-top:20px;text-align:center;border:1px dashed var(--primary);}
        .price-value{font-size:2.5rem;font-weight:700;color:var(--primary);margin:10px 0;}
        .hidden{display:none;}
        .loading{text-align:center;padding:20px;}
        .spinner{border:4px solid rgba(0,0,0,.1);border-radius:50%;border-top:4px solid var(--primary);width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto 15px;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:20px;color:#666;font-size:.9rem;}
        @media(max-width:768px){
            .container{padding:15px;}
            .card{padding:20px;}
            .logo-text h1{font-size:1.5rem;}
            .price-value{font-size:2rem;}
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="logo">
            <i class="fas fa-motorcycle"></i>
            <div class="logo-text">
                <h1>NOS</h1>
                <p>Nompak Ojek Situbondo</p>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="card">
        <h2 class="card-title"><i class="fas fa-biking"></i> Pesan Ojek Sekarang</h2>
        <form id="orderForm">
            <div class="form-group">
                <label>Nama Pemesan</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label>Lokasi Penjemputan</label>
                <input type="text" id="penjemputan" placeholder="Contoh: RSUD Situbondo" required>
            </div>
            <div class="form-group">
                <label>Alamat Tujuan</label>
                <input type="text" id="tujuan" placeholder="Contoh: SMAN 1 Situbondo" required>
            </div>
            <div class="form-group">
                <label>Jumlah Penumpang</label>
                <select id="penumpang" required>
                    <option value="" disabled selected>Pilih</option>
                    <option value="1">1 Orang</option>
                    <option value="2">2 Orang</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jarak (km)</label>
                <input type="number" id="jarak" placeholder="Akan otomatis terisi" readonly>
            </div>
            <button type="submit" class="btn btn-block">Hitung Biaya</button>
        </form>

        <div id="priceResult" class="price-display hidden">
            <h3>Total Biaya</h3>
            <div class="price-value" id="totalPrice">Rp 0</div>
            <button id="confirmBtn" class="btn btn-block">Konfirmasi Pesanan</button>
        </div>

        <div id="successMessage" class="hidden" style="text-align:center;margin-top:20px;">
            <i class="fas fa-check-circle" style="font-size:3rem;color:var(--success);"></i>
            <h3>Pesanan Diterima</h3>
            <p>Driver akan segera menghubungi Anda.</p>
            <button id="newOrderBtn" class="btn">Pesan Lagi</button>
        </div>
    </div>
</div>

<script>
/* ---------- CONFIG ---------- */
const TARIF_PER_KM   = 1200;
const MINIMUM_FARE   = 5000;
const NIGHT_FARE_MULTIPLIER   = 1.2;
const RAIN_FARE_MULTIPLIER    = 1.15;
const TWO_PASSENGER_MULTIPLIER= 1.3;

/* ---------- DATABASE KOORDINAT LENGKAP (Google Maps) ---------- */
/* latitude, longitude (decimal) */
const COORDS = {
  /* KANTOR & PEMERINTAHAN */
  "kantor bupati situbondo":              [-7.7070, 114.0120],
  "kantor camat situbondo":               [-7.7065, 114.0110],
  "kantor camat panarukan":               [-7.6965, 113.9200],
  "kantor camat mangaran":                [-7.7350, 113.9700],
  "kantor camat panji":                   [-7.7400, 114.0400],
  "kantor camat kapongan":                [-7.7830, 114.0700],
  "kantor camat arjasa":                  [-7.8180, 114.1000],
  "kantor camat jangkar":                 [-7.8500, 114.1300],
  "kantor camat asembagus":               [-7.8900, 114.1700],
  "kantor camat banyuputih":              [-7.9300, 114.2100],
  "kantor camat suboh":                   [-7.9700, 114.2500],
  "kantor camat mlandingan":              [-8.0100, 114.2900],
  "kantor camat besuki":                  [-8.0500, 114.3300],
  "kantor camat bungatan":                [-8.0900, 114.3700],
  "kantor camat kendit":                  [-8.1300, 114.4100],
  "kantor camat jatibanteng":             [-7.7500, 114.0500],

  /* RUMAH SAKIT */
  "rsud situbondo":                       [-7.7100, 114.0150],
  "rs bhayangkara situbondo":             [-7.7040, 114.0130],
  "puskesmas situbondo":                  [-7.7055, 114.0105],

  /* SEKOLAH */
  "sman 1 situbondo":                     [-7.7080, 114.0135],
  "sman 2 situbondo":                     [-7.7020, 114.0090],
  "smk n 1 situbondo":                    [-7.7075, 114.0145],
  "smp n 1 situbondo":                    [-7.7060, 114.0125],
  "smp n 2 situbondo":                    [-7.7045, 114.0115],
  "sd n 1 situbondo":                     [-7.7055, 114.0120],

  /* PASAR */
  "pasar situbondo":                      [-7.7062, 114.0111],
  "pasar panarukan":                      [-7.6965, 113.9200],
  "pasar mangaran":                       [-7.7355, 113.9705],
  "pasar panji":                          [-7.7405, 114.0405],
  "pasar kapongan":                       [-7.7835, 114.0705],
  "pasar arjasa":                         [-7.8185, 114.1005],

  /* SPBU */
  "spbu 44.571.01 panarukan":             [-7.6955, 113.9180],
  "spbu 44.571.02 situbondo":             [-7.7085, 114.0170],
  "spbu 44.571.03 mangaran":              [-7.7365, 113.9730],
  "spbu 44.571.04 panji":                 [-7.7415, 114.0430],
  "spbu 44.571.05 kapongan":              [-7.7845, 114.0730],

  /* MINIMARKET & SWALAYAN */
  "indomaret situbondo":                  [-7.7058, 114.0115],
  "alfamart situbondo":                   [-7.7068, 114.0125],
  "lottemart situbondo":                  [-7.7078, 114.0130],

  /* HOTEL */
  "hotel garuda situbondo":               [-7.7060, 114.0100],
  "hotel kharisma indah":                 [-7.7050, 114.0140],
  "hotel srikandi":                       [-7.7040, 114.0125],
  "favehotel panarukan":                  [-7.6960, 113.9190],

  /* TEMPAT WISATA */
  "pantai pasir putih":                   [-7.6950, 113.9100],
  "pantai mayangkar":                     [-7.7000, 113.9050],
  "bukit jaddih":                         [-7.7150, 113.9250],
  "taman nasional baluran":               [-7.8500, 114.4000],

  /* TERMINAL */
  "terminal situbondo":                   [-7.7040, 114.0160],
  "terminal panarukan":                   [-7.6970, 113.9220],

  /* KEAMANAN */
  "polres situbondo":                     [-7.7075, 114.0140],
  "polsek panarukan":                     [-7.6975, 113.9210]
};

/* ---------- FUNGSI HAVERSINE ---------- */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function normalize(str) {
  return str.toLowerCase().trim();
}

function findCoord(name) {
  return COORDS[normalize(name)] || null;
}

/* ---------- DOM ---------- */
const orderForm    = document.getElementById('orderForm');
const priceResult  = document.getElementById('priceResult');
const successMsg   = document.getElementById('successMessage');
const totalPriceEl = document.getElementById('totalPrice');

orderForm.addEventListener('submit', function (e) {
  e.preventDefault();

  const nama        = document.getElementById('nama').value.trim();
  const penjemputan = document.getElementById('penjemputan').value.trim();
  const tujuan      = document.getElementById('tujuan').value.trim();
  const penumpang   = document.getElementById('penumpang').value;

  if (!nama || !penjemputan || !tujuan || !penumpang) {
    alert('Mohon lengkapi semua data.');
    return;
  }

  const a = findCoord(penjemputan);
  const b = findCoord(tujuan);
  if (!a || !b) {
    alert('Lokasi tidak ditemukan. Pastikan nama tempat sesuai daftar.');
    return;
  }
  const jarak = haversine(...a, ...b).toFixed(1);
  document.getElementById('jarak').value = jarak;

  let base = Math.max(MINIMUM_FARE, jarak * TARIF_PER_KM);
  let extra = 0;

  const now   = new Date();
  const malam = now.getHours() >= 20 || now.getHours() < 5;
  const hujan = Math.random() > 0.7; // simulasi
  const dua   = penumpang === "2";

  if (malam) extra += base * (NIGHT_FARE_MULTIPLIER - 1);
  if (hujan) extra += base * (RAIN_FARE_MULTIPLIER  - 1);
  if (dua)   extra += base * (TWO_PASSENGER_MULTIPLIER - 1);

  const total = Math.round(base + extra);
  totalPriceEl.textContent = `Rp ${total.toLocaleString('id-ID')}`;

  priceResult.classList.remove('hidden');
  priceResult.scrollIntoView({behavior:'smooth'});
});

document.getElementById('confirmBtn').addEventListener('click', () => {
  priceResult.classList.add('hidden');
  successMsg.classList.remove('hidden');
});

document.getElementById('newOrderBtn').addEventListener('click', () => {
  orderForm.reset();
  document.getElementById('jarak').value = '';
  successMsg.classList.add('hidden');
});
</script>
</body>
</html>
